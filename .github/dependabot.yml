version: 2

# Why this file exists: the repo had `dependabot_security_updates` enabled,
# which looks like coverage but only fires on a published advisory against a
# detected manifest. GitHub Actions `uses:` pins are scanned ONLY through the
# `github-actions` ecosystem below, so without this file the pins were
# hand-maintained and drifted a full major behind on seven actions.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build

    # Read this before adding an `ignore` rule for semver-major here.
    #
    # Every pin in this repo is a bare floating major (`actions/checkout@v7`).
    # The dependency graph records that as the requirement `7.*.*`, which every
    # v7 release already satisfies -- so minor and patch updates have nothing to
    # open a PR about. A major is the ONLY update this block can ever produce.
    # Ignoring majors here would therefore silence the block entirely, which is
    # precisely the state this file was added to fix.
    #
    # A major PR is safe to let Dependabot OPEN. It is not safe to assume it
    # then sits there. This block used to say "no workflow in this repo calls
    # dependabot-auto-merge.yml on itself, so the PR waits for a human"; the
    # first half is still true and the conclusion never was. pr-merge.yml runs
    # on `pull_request_review` and merges on an approving review from
    # `claude[bot]`, which is exactly what the review agent posts -- so a
    # Dependabot PR here can land with no human in the loop, by the OTHER
    # merge path.
    #
    # That path got narrower and more load-bearing on 2026-09-22: pr-checks.yml
    # now gates the CI review to `dependabot[bot]`, so a Dependabot PR is the
    # ONLY kind this repo still reviews, approves and merges by itself.
    #
    # And the merge ships: tag-release.yml tags every push to main and re-points
    # the floating major (`v8` today), which every caller resolves at runtime.
    # So the reviewing agent, not a human, is what stands between a major action
    # bump and 20 caller repos. Read the changelog yourself on anything the
    # agent approved but you would not have, and pick the #minor/#major token
    # deliberately -- in the PR TITLE, which since 2026-09-22 is authoritative
    # for the squash subject on every path (repo setting squash_merge_commit_title
    # = PR_TITLE; see CLAUDE.md).
    #
    # The group below IS load-bearing now. node-test.yml, deploy-cloudflare.yml
    # and release-extension.yml pin `pnpm/action-setup` to a commit SHA, which
    # the graph records as an exact requirement -- so Dependabot will open
    # SHA-bump PRs against it, and those arrive as patch/minor, not major.
    #
    # Such a PR passes every static assertion in scripts/check-workflows.py --
    # still one SHA, still one default -- while silently moving the version the
    # action BOOTSTRAPS away from the `pnpm-version` default. That is exactly
    # the break the pin exists to prevent, and the first run of it goes green.
    #
    # Deliberately NOT ignored here: the guard job runs the bootstrap check with
    # CHECK_PNPM_BOOTSTRAP=1, so the PR fails loudly and names the new version,
    # which is the signal you want. An `ignore` entry would instead freeze the
    # action forever and silently. Merging such a PR means editing the
    # `pnpm-version` default and the PNPM_BOOTSTRAP_VERSION guards in the same
    # commit -- see the comment on that input in node-test.yml.
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Only the refresher image is listed. runner-image/Dockerfile is deliberately
  # `ARG BASE_TAG=latest` -- runner-image.yml resolves :latest to a concrete
  # version tag at build time and passes it back in, so that base is already
  # tracked, by the build rather than by Dependabot. Listing it here would imply
  # coverage that cannot work (Dependabot cannot bump an ARG-templated tag, and
  # `latest` is not a version), and pinning the ARG to satisfy Dependabot would
  # break the reproducible-build design that comment describes.
  - package-ecosystem: docker
    directories:
      - "/k8s/ghcr-pull-refresher/image"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
