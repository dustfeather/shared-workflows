name: Merge on approval (reusable)

# Lands a PR when it receives an approving review — e.g. the approval the
# claude-code-review.yml agent submits via `gh pr review --approve`. Any
# approving review (human or bot) triggers it; the caller's branch protection
# still decides whether the merge is actually allowed to proceed.
#
# Pair this with a `pull_request_review` trigger in the caller shim:
#
#   on:
#     pull_request_review:
#       types: [submitted]
#   jobs:
#     merge:
#       uses: dustfeather/shared-workflows/.github/workflows/merge-on-approval.yml@v6
#       secrets: inherit   # cross-owner (ITGuys-RO/*) callers: pass explicitly
#
# The job's own `if:` filters to approved, non-draft reviews, so the shim
# does not need its own guard.

on:
  workflow_call:
    inputs:
      mode:
        description: |
          How to merge. "auto" (default) calls `gh pr merge --auto` so the
          merge fires once all required status checks pass — requires
          GitHub's auto-merge feature enabled on the repo (Pro+ for private
          repos, Free only for public). "direct" merges immediately, which
          fails if required checks are still pending — use only where
          auto-merge is unavailable AND the approving review can only land
          after CI is already green.

          LINKED-ISSUE CLOSING IS "direct" ONLY. On "direct" this workflow
          closes the PR's `Closes #N` issues itself, because GitHub does not
          run closing-keyword handling for a merge performed with
          GITHUB_TOKEN. On "auto" it cannot: `gh pr merge --auto` hands the
          merge to GitHub and returns immediately, so this job finishes before
          anything is merged and there is nothing to close. Whether GitHub's
          own keyword handling fires for the deferred auto-merge has NOT been
          verified here — do not assume either way. If you need the close
          guaranteed, use "direct".
        type: string
        default: auto
      merge-method:
        description: |
          "squash" (default) combines the PR commits into a single commit on
          the base branch. Override with "rebase", "merge", or "auto"
          ("auto" detects the first allowed method on the repo, priority
          squash > rebase > merge).
        type: string
        default: squash
      delete-branch:
        description: Delete the PR's head branch after a successful merge.
        type: boolean
        default: true
      match-head-commit:
        description: |
          Refuse the merge unless the PR head is still this exact SHA. Empty
          (the default) merges whatever the head is at merge time, which is
          the prior behaviour.

          An approval is given to a COMMIT; the merge is not tied to one. A
          commit pushed between the approving review and this job landing
          therefore gets merged unreviewed, and a caller without branch
          protection has no stale-review dismissal to catch it. The window is
          small; the pipeline is unattended.

          Pass the review event's `commit_id` — the SHA the review actually
          approved. It is not written out here: an expression in this
          description would be evaluated as one, and the `on:` block is
          parsed before any context exists, so the file would be rejected
          outright and every caller would break. See the shim in this repo's
          own `pr-merge.yml` for the literal form.

          A head that no longer matches fails the job loudly and leaves the
          PR open, which is the correct outcome: the new commit has not been
          reviewed.
        type: string
        default: ""
      runner:
        description: |
          Self-hosted ARC scale-set label for the runner pool. Defaults to
          `arc-df-shared-workflows`; each caller normally pins its own
          scale-set (e.g. `arc-df-uninsta`, `arc-itguys-ro-invest`).
        type: string
        default: "arc-df-shared-workflows"

permissions:
  contents: read

jobs:
  merge:
    # Only act on a freshly submitted approving review of a non-draft PR that is
    # still open.
    #
    # `github.event` here is the caller's `pull_request_review` payload, and its
    # `pull_request` is octokit's reduced `SimplePullRequest`, not the full
    # `pull_request`-event object — confirmed against octokit/webhooks'
    # generated types (payload-types/schema.d.ts): it carries `state`, `draft`
    # and `merged_at`, but NOT `merged`. An earlier version of this guard added
    # `github.event.pull_request.merged == false` believing it excluded an
    # already-merged PR; it does not, because that property does not exist on
    # this event. GitHub Actions expressions don't error on a missing property,
    # they return `null`, and `null == false` is loosely-true (both coerce to
    # `0`), so the term was unconditionally true and skipped nothing.
    #
    # `state == 'open'` is the entire guard, and it is sufficient on its own: a
    # merged PR's `state` is always `closed`, same as a PR closed without
    # merging, so this one term already excludes both. A second approving
    # review routinely lands after the PR has already merged — a reviewer
    # finishing a round the automation did not wait for. Without this term the
    # job runs, `gh pr merge` exits nonzero with `! Pull request #N was already
    # merged`, and the merged-state fallback then reads MERGED and treats the
    # run as a success it did not perform. That false success is
    # indistinguishable from a real merge to anything watching
    # `workflow_run.conclusion == 'success'`, so it re-triggers the caller's
    # deploy: observed 2026-09-13 on ITGuys-RO/fleet-manager#152, where a stale
    # review at 21:15 caused a second live Cloudflare deploy of a commit that
    # had already deployed cleanly 17 minutes earlier.
    #
    # Skipping at the job level rather than exiting early inside a step is the
    # point. A job whose `if:` is false is `skipped`, and a run whose only job
    # skipped concludes `skipped` — which the deploy guard correctly ignores. A
    # step that returns early still leaves the job green, which is the bug.
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.state == 'open'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
      # Without this, a merged `Closes #N` links but never closes. GitHub computes
      # `closingIssuesReferences` for free at PR open; EXECUTING the close at merge
      # is a separate write to the Issues API, attributed to whoever performed the
      # merge — here, GITHUB_TOKEN in the step below. Lacking the scope, the merge
      # still succeeds, the link is still stored, and the close silently does not
      # happen: no warning, no annotation, green run. Measured on
      # ITGuys-RO/fleet-manager, where it had never worked and every "closed by a
      # PR" issue had actually been closed by hand.
      #
      # NOTE FOR ANY FUTURE SCOPE ADDED HERE: a called workflow may not request
      # more GITHUB_TOKEN permission than the calling job grants, and
      # `permissions:` takes no expressions, so the scope cannot be conditional.
      # Adding one here before every caller grants it turns each of those callers
      # into a startup_failure — zero jobs, empty `--log-failed`, no annotation,
      # in repos nobody touched. Callers first, then this file, then the tag.
      issues: write
    steps:
      - name: Merge on approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODE: ${{ inputs.mode }}
          MERGE_METHOD_INPUT: ${{ inputs.merge-method }}
          DELETE_BRANCH: ${{ inputs.delete-branch }}
          MATCH_HEAD_COMMIT: ${{ inputs.match-head-commit }}
        run: |
          # Strictness stated, not assumed. A `run:` step with no `shell:`
          # is executed as `bash -e {0}`, so `-e` is already on — GitHub's
          # reference is explicit that bash and sh "enforce fail-fast using
          # set -e". `-o pipefail` is NOT on: that arrives only with an
          # explicit `shell: bash`. Spelling all three out fixes the real
          # gap, keeps the guarantees stable if a `shell:` is ever added or
          # the default changes, and says plainly which ones the script
          # below relies on.
          set -euo pipefail

          # Resolve merge method. "auto" detects the first allowed method on
          # the repo; anything else maps straight to the gh flag.
          if [ "$MERGE_METHOD_INPUT" = "auto" ]; then
            methods=$(gh api "/repos/$REPO" --jq '
              (if .allow_squash_merge then "--squash " else "" end) +
              (if .allow_rebase_merge then "--rebase " else "" end) +
              (if .allow_merge_commit then "--merge " else "" end)
            ')
            method=$(echo "$methods" | awk '{print $1}')
            if [ -z "$method" ]; then
              echo "::error::No merge method enabled on $REPO"
              exit 1
            fi
          else
            method="--$MERGE_METHOD_INPUT"
          fi
          echo "Merge method: $method"
          echo "PR: $PR_URL"

          # Bump-token guard. This runs BEFORE the merge on purpose: here the
          # cost of being wrong is a re-run, and one line further down it is
          # unrecoverable. The merge cannot be undone, tag-release.yml only ever
          # sees this job's `workflow_run`, and a nonzero exit after the merge
          # therefore costs the tag outright with no retry path.
          #
          # The hazard is specific to squash. A bump token (`#minor`/`#major`)
          # is written on a commit SUBJECT, and tag-release.yml scans subjects
          # only — deliberately, because a body that *discusses* a bump matches
          # itself and cuts a spurious release. A squash merge produces ONE
          # commit whose subject is the PR title and moves every branch subject
          # into the body, so the token lands exactly where the scan is designed
          # not to look. The release silently degrades to a patch and nothing
          # warns. Measured on dustfeather/shared-workflows 2026-09-13.
          #
          # Rebase and merge-commit flows replay the subjects intact, so they
          # are not checked. Compare the EFFECTIVE bump rather than each token:
          # a `#minor` on a branch commit under a `#major` PR title is already
          # subsumed (largest wins), and failing on it would be noise.
          #
          # The two markers below delimit what tests/guard/extract.sh slices out.
          # They exist so the slice never has to anchor on a line of the code
          # under test: the `--squash` condition WAS the anchor, which made it
          # the one line the suite could not mutate -- changing it deleted the
          # anchor, the slice silently started somewhere else, and every case
          # failed for an unrelated reason that looked like a strong signal.
          # guard-slice-begin
          if [ "$method" = "--squash" ]; then
            pr_title=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')
            # Subjects come from REST, NOT `gh pr view --json commits`. That
            # field is GraphQL `messageHeadline`, which returns GitHub's DISPLAY
            # form: measured on this PR, every subject longer than 72 characters
            # comes back as exactly 70 -- 69 characters plus a U+2026 ellipsis --
            # however much longer the real one is, while 72 and under are
            # untouched. The bump token is APPENDED by convention, so the clip
            # eats precisely the substring this scan searches for. The guard
            # would then read "no bump token asked for", allow the merge, and the
            # release would degrade to a patch with nothing in the log to say
            # why. Three commits on this branch are long enough (73, 75, 80).
            #
            # REST returns the raw message, so take its first line: bodies stay
            # excluded, which is the rule tag-release.yml itself scans by (prose
            # discussing a bump matched itself and cut a spurious minor).
            # per_page rides in the PATH, not in `-F`. `gh api` defaults to GET
            # only while no parameters are supplied; a single `-f`/`-F` flips the
            # default method to POST, and POST on this route is a 404. Under the
            # `set -euo pipefail` above that kills the step before the merge, so
            # EVERY squash merge through this workflow would fail for every
            # caller -- with the error pointing at the guard rather than at the
            # merge. `-X GET` would also work; a query string cannot be undone by
            # a later flag, so it is the safer of the two.
            #
            # The `// ""` and the `if . == ""` arm are both load-bearing on a
            # commit made with --allow-empty-message.
            #
            # `"" | split("\n")` is the EMPTY ARRAY, so `[0]` is null, and
            # `sub` on null is a hard jq error: "null (null) cannot be matched,
            # as it is not a string". Under the `set -euo pipefail` above that
            # kills the step, and the log blames the guard rather than the empty
            # commit. `// ""` turns the null back into a string first.
            #
            # Then the placeholder: command substitution strips trailing
            # newlines, so a LAST commit with an empty subject would vanish from
            # the capture, leaving n_commits one short of declared_commits below
            # and refusing a perfectly good merge under an error about the 250
            # cap that has nothing to do with it. An empty subject can carry no
            # token, so neither arm can mask one.
            pr_subjects=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" \
              --jq '.[].commit.message | split("\n")[0] // "" | sub("\r$";"") | if . == "" then "(empty subject)" else . end')

            # This list is capped -- the pull-request commits endpoint stops at
            # 250 however far it is paginated -- and a token past the cap is
            # exactly the silent failure this guard exists to prevent.
            #
            # Do not test the count against the cap. `--paginate` defaults to
            # per_page=30, which stops at the last whole page below the cap, so a
            # `-ge 250` test would never fire and the truncation would pass
            # unnoticed; the per_page=100 above happens to make the boundary land
            # on 250, but that is arithmetic to get wrong twice. Compare against the PR's own
            # declared commit count instead, which is a plain integer on the PR
            # object and carries the TRUE total -- measured on NixOS/nixpkgs#560469,
            # where `.commits` is 780 while the paginated commits listing returns
            # exactly 250. So the two sides legitimately disagree past the cap and
            # the refusal below fires there instead of failing open.
            #
            # A failed PAGE is not among the causes this can see, though it is
            # tempting to list: `pr_subjects` is assigned from a command
            # substitution, and under the `set -euo pipefail` at the top of this
            # step a nonzero `gh api` kills the step outright, so a dropped page
            # never reaches the comparison. What reaches it is truncation at the
            # cap and a head that moved between the reads -- nothing else.
            # Three reads across two endpoints, so the head can move between any
            # of them, and the refusal must not name a cause it cannot know.
            #
            # The re-read below catches ONE of the two orderings: a push landing
            # between the declared-count read and the re-read changes the count
            # under us, and the two readings name it a moving head. The MIRROR
            # ordering is invisible to it -- a push landing between the commit
            # list and the declared-count read leaves declared and recheck equal
            # (both post-push) while the subjects are pre-push, so the shortfall
            # looks exactly like truncation on a PR that may have twenty commits.
            # That is the same wrong diagnosis the re-read exists to prevent,
            # pointing the other way.
            #
            # `declared_commits` is what separates them, because it is not capped
            # -- measured above at 780 against a 250-item listing. A PR at or
            # below 250 could have had every commit returned, so the cap cannot
            # explain a shortfall there, and the message says so instead of
            # asserting truncation. Note the direction of the dependency: 250
            # picks WORDING here, never whether to refuse. The refusal is already
            # decided by the count mismatch above, so if GitHub ever moves the
            # cap the worst outcome is a message that hedges the wrong way.
            #
            # This narrows the race rather than closing it; the merge itself is
            # what closes it, via `--match-head-commit` when the caller sets it.
            declared_commits=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.commits')
            n_commits=$(printf '%s' "$pr_subjects" | grep -c '' || true)
            if [ "$n_commits" -ne "$declared_commits" ]; then
              recheck_commits=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.commits')
              if [ "$recheck_commits" -ne "$declared_commits" ]; then
                echo "::error::The head of #${PR_NUMBER} moved while this guard was reading it: the commit count went from ${declared_commits} to ${recheck_commits} between two reads, and the ${n_commits} subjects scanned are from before that. A bump token on a commit that arrived mid-read would be invisible here, so this merge is refused. Re-run once the branch has settled; set match-head-commit if you want the merge itself to refuse a moved head."
                exit 1
              fi
              # Both directions are reachable, and only one of them is a short
              # read. Commits can be REMOVED between the two reads as well as
              # added -- a force-push or a base rebase -- which leaves MORE
              # subjects in hand than the PR now declares. The recheck above
              # does not catch it unless the count moves a second time, so
              # without this arm the message reports "declares 3 but only 5
              # could be read" and hangs a cap diagnosis off it. Refusing is
              # right either way; the diagnosis is what has to stop guessing.
              if [ "$n_commits" -gt "$declared_commits" ]; then
                cause="that is MORE subjects than the PR declares, so the head shrank between the two reads -- a force-push or a base rebase dropped commits after the list was fetched. The subjects in hand are from before that, and the cap plays no part in it"
              elif [ "$declared_commits" -gt 250 ]; then
                cause="${declared_commits} is past the 250-commit cap on the pull-request commit list, so the read was most likely truncated there -- though a push landing between the two reads produces the same shortfall"
              else
                cause="${declared_commits} is within the 250-commit cap on that list, so truncation does not explain this either -- what is left is a push landing between the commit read and the count read"
              fi
              echo "::error::PR #${PR_NUMBER} declares ${declared_commits} commits and ${n_commits} subjects were read -- ${cause}. A bump token on a commit this guard did not scan would be invisible here, so this merge is refused rather than decided from a list that does not match the PR. Re-run; if it repeats, check the subjects by hand and merge manually, or split the PR."
              exit 1
            fi

            # `--subject` replaces GitHub's own squash-title composition
            # wholesale, and that composition appends "(#<number>)". Reproduce
            # the suffix rather than inherit it: `git log --oneline` and the
            # blame UI key the PR backlink off it, so dropping it would strip
            # that backlink from every commit landing through this workflow, for
            # every caller. It cannot disturb the scan below — the bump match is
            # a fixed-string search anywhere in the subject.
            # Strip an existing suffix before appending, so a title copied from
            # a `git log --oneline` line does not land as "... (#42) (#42)".
            squash_subject="${pr_title%" (#$PR_NUMBER)"} (#$PR_NUMBER)"

            # The merge below passes `--subject "$squash_subject"`, so the landing
            # subject IS the PR title — by construction, not by prediction.
            #
            # That is the whole reason the flag is passed. Left off, the subject
            # comes from the repo's `squash_merge_commit_title` setting, and
            # GitHub's default `COMMIT_OR_PR_TITLE` uses THE COMMIT's subject on
            # a single-commit PR, switching to the PR title only from two commits
            # up. A guard would then have to infer which text wins from a
            # per-repo setting nobody audits, and the rule taught to humans would
            # have to be "put the token in both places, because it depends".
            # Controlling the subject collapses both into one rule: PR title.
            bump_rank() {
              case "$1" in
                *'#major'*) echo 2 ;;
                *'#minor'*) echo 1 ;;
                *)          echo 0 ;;
              esac
            }
            # Join with printf rather than an inline literal newline: a
            # continuation line at column 0 would terminate this `run: |` block
            # scalar and break the file (caught by the YAML parse, but only after
            # the fact).
            asked_text=$(printf '%s\n%s' "$pr_title" "$pr_subjects")
            title_rank=$(bump_rank "$squash_subject")
            asked_rank=$(bump_rank "$asked_text")

            if [ "$title_rank" -lt "$asked_rank" ]; then
              case "$asked_rank" in
                2) asked='#major' ;;
                *) asked='#minor' ;;
              esac
              echo "::error::A ${asked} token was requested on a commit subject, but this squash lands ONE commit whose subject is the PR TITLE. tag-release.yml reads subjects only, so the token would end up in the commit body where the scan is designed not to look, and the release would be cut as a patch. Fix: edit the PR title to contain ${asked}, then re-run. Editing the title needs no new commit, so the approving review still stands. Pushing another commit to carry the token does NOT work — its subject becomes body text too."
              exit 1
            fi
            # Always say what this merge will cut, not only when a bump was
            # asked for. Forcing the subject closed one hazard and opened its
            # mirror: the PR title is now ALWAYS the landing subject, so a token
            # written incidentally in a title — quoting an error, naming the
            # convention in prose — cuts that release. tag-release.yml excludes
            # commit BODIES for exactly this reason (prose discussing a bump
            # matched itself and cut a spurious minor, measured), but a title
            # has no such exclusion available: under this convention the title
            # is the only channel, so an incidental token and an intended one
            # are identical text and no check can separate them.
            #
            # So the guard does the one thing that is actually available --
            # state the consequence in the log, before the merge.
            #
            # The subject is frozen on BOTH modes, and the freeze point is the
            # `pr_title` read at the top of this step -- not the merge. That read
            # is baked into `squash_subject` and passed as `--subject`; nothing
            # re-reads the title afterwards. So a title edit made after this
            # point changes nothing on `direct` either. MODE changes only how
            # long the window between the read and the merge is: seconds on
            # `direct`, indefinite on `auto`, where GitHub then holds the value
            # itself -- GraphQL's `AutoMergeRequest` carries `commitHeadline`
            # alongside `enabledAt`, so it is stored at enable time rather than
            # recomputed at merge time. That is why `auto` warns: the window is
            # long enough that someone will try to edit the title inside it.
            #
            # Known bound, both modes: `commitHeadline` is documented as IGNORED
            # when the base branch merges through a MERGE QUEUE, which hands the
            # subject back to GitHub's own composition and voids the control
            # this guard rests on. No caller uses one today; a caller that
            # adopts one needs this guard to grow a check for it.
            # Print the landing subject itself, not only the bump it implies.
            # A human auditing this log for an incidental token, or checking
            # that the "(#N)" de-duplication above produced the right text, has
            # nothing to read otherwise.
            # "would land", not "will land". The one configuration this guard
            # cannot control is a base branch behind a MERGE QUEUE, which
            # discards the subject passed here and composes its own (see the
            # note above). No caller uses one, so there is nothing to detect
            # today and a detection call that can never fire is worse than none
            # -- but a log line that states the outcome as fact would be
            # confidently wrong in exactly that case, and a wrong log is worse
            # than a hedged one. The hedge costs a word.
            echo "Bump-token guard: this squash would land the subject: ${squash_subject} (a base branch behind a merge queue discards it and composes its own; no caller uses one)"
            case "$title_rank" in
              2) cuts="MAJOR release (major token found in the PR title)" ;;
              1) cuts="MINOR release (minor token found in the PR title)" ;;
              *) cuts="PATCH release (no bump token in the PR title)" ;;
            esac
            if [ "$MODE" = "direct" ]; then
              echo "Bump-token guard: this merge will cut a ${cuts}. The subject was captured at the top of this step, so editing the PR title from now on does not change this release; re-run to change it. On this mode the merge follows within seconds, so that window is short."
            else
              echo "::warning::Bump-token guard: this merge will cut a ${cuts}. The subject was captured at the top of this step, so editing the PR title from now on changes NOTHING about the release this cuts. Mode is '${MODE}', so the merge may not happen for a long time yet — GitHub stores the subject when auto-merge is enabled below and does not re-read the title when it finally merges, so the wait does not give the title back. To change it: edit the title, then re-run this workflow, which needs a fresh approving review or a manual dispatch."
            fi
          fi

          del=""
          if [ "$DELETE_BRANCH" = "true" ]; then
            del="--delete-branch"
          fi

          # Pin the merge to the reviewed commit when the caller asked for it.
          # `gh` fails the merge if the head has moved since, which is the
          # point: the commit that moved it has not been reviewed.
          match=""
          if [ -n "${MATCH_HEAD_COMMIT:-}" ]; then
            match="--match-head-commit $MATCH_HEAD_COMMIT"
            echo "Merge pinned to reviewed head $MATCH_HEAD_COMMIT."
          fi

          # `direct` captures the status instead of letting `set -e` act on it.
          # This command can exit nonzero AFTER the merge has already landed —
          # `--delete-branch` failing on a protected or already-deleted branch is
          # the obvious way, and gh's exact exit behaviour there is NOT verified
          # here. Under `set -e` that kills the step before any of the post-merge
          # work below, which is the same unrecoverable outcome every comment
          # down there is written to avoid: tag-release.yml only ever sees this
          # job's `workflow_run`, so a failed step means the merge commit is
          # never tagged and there is no retry path, and the linked issues are
          # never closed and never annotated.
          #
          # Nothing is assumed about what the status means. The merged-state read
          # below is what adjudicates, and it already distinguishes merged from
          # not-merged from could-not-tell. A nonzero status just gets said out
          # loud so the log shows it alongside whatever that read concludes.
          #
          # `auto` stays bare. There the merge has NOT happened — gh hands it to
          # GitHub and returns — so a nonzero exit means auto-merge was not
          # enabled, nothing landed, and there is no tag or close to strand.
          # Failing is the correct outcome on that path.

          # Assembled as an array: `--subject` carries a PR title with spaces in
          # it, while the unquoted `$del $match` below depend on word splitting
          # and so cannot hold one. Never empty, which keeps `set -u` happy.
          #
          # The subject reaches BOTH paths, and on `auto` -- the default -- it
          # survives all the way to the merge. MEASURED end to end on a
          # throwaway repo, not argued from source: enabling auto-merge with
          # `--subject "STORED HEADLINE probe (#1)"` put that exact string in
          # `autoMergeRequest.commitHeadline`; editing the PR title afterwards
          # left commitHeadline untouched; and when the blocking check went
          # green the landed squash commit read `STORED HEADLINE probe (#1)`,
          # not the original title and not the edited one. So the guard's
          # promise holds for `mode: auto` callers, and the freeze CLAUDE.md
          # describes is the observed behaviour rather than an inference.
          #
          # The mechanism, for whoever has to re-check this: gh builds one
          # `MergePullRequestInput` and sets `CommitHeadline` on it before
          # choosing the mutation; the auto path then sends
          # `EnablePullRequestAutoMergeInput{input}`, which embeds that same
          # struct.
          #
          # Read out of cli/cli `pkg/cmd/pr/merge/http.go`, not assumed, and
          # checked across releases rather than at one version: v2.0.0, v2.20.0,
          # v2.40.0 and v2.55.0 all set `CommitHeadline` BEFORE branching on
          # `auto`. If gh ever splits the two paths, this comment is the thing to
          # re-check.
          #
          # That evidence bounds the PAYLOAD FIELD, not the CLI flag, and the two
          # have different floors -- do not read the paragraph above as licensing
          # "any gh 2.x" for `--subject` itself. The flag's own floor, measured in
          # cli/cli history: `gh pr merge -t/--subject` first shipped in **v2.4.0**
          # (commit f2d23d8c88845b8cf94a54130baa9fd5531e8801, "Allow editing commit
          # subject when squash-merging a PR"; absent from the v2.3.0 tree, present
          # in v2.4.0 at pkg/cmd/pr/merge/merge.go). `-t` and `--subject` are one
          # `StringVarP` call, so there is no separate short-form floor.
          #
          # Worth pinning because of where an unknown flag lands, which is not
          # symmetric: on `auto` -- the DEFAULT mode -- the bare `gh pr merge
          # --auto` below is unguarded and the step fails for that caller, while
          # `direct` swallows the same failure into "It may still have merged".
          # v2.4.0 is from 2021 and GitHub-hosted and ARC runners are far past it,
          # so this cannot bite today; the floor is recorded so the next reader
          # inherits a checked number instead of a plausible one.
          args=("$method")
          if [ "$method" = "--squash" ]; then
            args+=(--subject "$squash_subject")
          fi

          merge_rc=0
          if [ "$MODE" = "direct" ]; then
            gh pr merge "$PR_URL" "${args[@]}" $del $match || merge_rc=$?
            if [ "$merge_rc" -ne 0 ]; then
              echo "::error::gh pr merge exited ${merge_rc} for $PR_URL. It may still have merged — the branch deletion can fail after the merge lands. See the merge state reported below; do not assume this means nothing merged."
            fi
          else
            gh pr merge --auto "${args[@]}" "$PR_URL" $del $match
          fi

          # guard-slice-end
          # --- Close the PR's linked issues ourselves ----------------------
          # GitHub does NOT execute closing-keyword handling for a merge
          # performed with GITHUB_TOKEN. It still COMPUTES the link — but it
          # never runs the close.
          #
          # MEASURED on ITGuys-RO/fleet-manager, 2026-09-13. PR #151 carried
          # `Closes #149.`, merged clean into the default branch as
          # github-actions[bot], and the job's own permission group printed
          # `Issues: write` at runtime. `closingIssuesReferences` returned
          # `[{"number":149}]` both before and after the merge. Issue #149 got
          # NO `closed` timeline event at all — not a rejected close, no close
          # attempted. Granting `issues: write` was necessary and did not fix
          # it; that scope is what makes the block BELOW legal, nothing more.
          #
          # The repo's whole history agrees: every issue ever "closed by a PR"
          # there was closed by hand, and the one issue closed with a non-null
          # commit_id was a direct human push whose own commit message carried
          # the keyword — never a bot merge.
          #
          # RESOLVED, 2026-09-13 — the apparent counter-example turned out to
          # be a DIFFERENT mechanism, and the rule above stands unchanged.
          #
          # On dustfeather/shared-workflows PR #37 the linked issue #35 DID
          # close on a GITHUB_TOKEN merge, which read like a contradiction of
          # everything above. It is not one. GitHub has TWO independent
          # closers:
          #
          #   1. PR-merge-time, driven by `closingIssuesReferences` computed
          #      from the PR BODY. This is the one suppressed for a merge
          #      performed with GITHUB_TOKEN, scope or no scope.
          #   2. A push-time scan of each COMMIT MESSAGE landing on the default
          #      branch, tied to no PR at all.
          #
          # #35 was closed by (2). Commit 7f70879 ends with `Closes #35` in its
          # own body; `merge-method: rebase` replays branch commits onto main
          # verbatim rather than synthesising a message; and #35's `closed`
          # event carries commit_id 7f70879 — NOT PR #37's merge commit
          # 73bfd19. The control is PR #39: body `Fixes #38.`, commit body
          # carrying no keyword, `closingIssuesReferences` registering #38
          # correctly — and #38 has no `closed` event at all. Same actor, same
          # token, same merge path, same day. The only difference is whether a
          # COMMIT MESSAGE carried the keyword.
          #
          # Those raw facts are read straight from the API. The two-mechanism
          # reading of them is inference, not something GitHub documents — but
          # it explains both measurements and nothing else does.
          #
          # Two consequences for this block:
          #   - Path (1) is genuinely dead for us, so this block is
          #     load-bearing, not belt and braces. A PR whose keyword lives
          #     only in the description closes nothing without it.
          #   - Path (2) can close the issue BEFORE this block runs, on any
          #     caller merging by rebase with a keyword-carrying commit. The
          #     read below filters to state == OPEN, so that is a logged no-op
          #     rather than a double close.
          #
          # Under the default `squash` the branch's commit messages land in the
          # BODY of the synthesised commit rather than as commits of their own.
          # Whether path (2) still fires from there has NOT been measured, and
          # nothing here depends on the answer: path (1) is dead regardless, so
          # this block is what closes the issue, and the state == OPEN filter
          # makes path (2) harmless whichever way it goes. The #35 measurement
          # below is a rebase-era observation kept as evidence for the
          # two-closer reading, not a description of the current default.
          #
          # `direct` only. On the `--auto` path gh hands the merge to GitHub
          # and returns immediately, so nothing has merged yet and there is
          # nothing to close; that path keeps its existing behaviour.
          if [ "$MODE" != "direct" ]; then
            echo "Mode is '$MODE', not 'direct': the merge is deferred to GitHub, so this run has nothing merged yet and closes no linked issues. See the \`mode\` input description."
          fi

          if [ "$MODE" = "direct" ]; then
            # Read the state into a variable rather than testing the
            # substitution inline. Command substitution inside an `if`
            # condition is EXEMPT from `set -e`, so a failed `gh pr view`
            # collapses to "" — which is != "true" — and an inline test cannot
            # tell "the PR is not merged" from "I could not find out". They are
            # different facts and get different annotations here: `unknown`
            # says the read failed, `false` says the merge did not happen.
            # Reporting the second when the first is true sends someone looking
            # for a failed merge that never failed.
            #
            # `--json state`, NOT `--json merged`. There is no `merged` field:
            # gh answers that request with `Unknown JSON field: "merged"` plus a
            # dump of the real ones (`state`, `closed`, `mergedAt`, `mergedBy`),
            # and exits nonzero — so this read took its failure branch on EVERY
            # direct merge from v5.1.0 to v5.2.0. `merged` became `unknown`, the
            # close loop below never ran once, and because nothing here exits
            # nonzero after a merge the job stayed green with the annotation
            # buried in the log. The feature was dead code and looked shipped.
            # Measured on PR #37, run 34779875479.
            #
            # `(.state == "MERGED")` makes jq emit a bare `true`/`false`, which
            # is what every comparison below already expects — so the
            # three-state logic (`true` / `false` / `unknown`) is unchanged.
            if ! merged=$(gh pr view "$PR_URL" --json state --jq '(.state == "MERGED")'); then
              echo "::error::Could not read the merge state of $PR_URL (merge command exited ${merge_rc}). Verify it and close any linked issues by hand."
              merged=unknown
            fi

            # NOTHING here exits nonzero, including this branch, even though
            # "the merge did not happen" sounds like the one case worth failing
            # for. It is not, and an earlier revision of this PR had it wrong
            # twice:
            #
            #   - If the read is RIGHT, main did not move. Exiting nonzero makes
            #     tag-release.yml's `workflow_run.conclusion == 'success'` guard
            #     false, so that workflow never runs — and its head-already-
            #     tagged branch carries a ::warning:: written for precisely this
            #     ambiguity ("if a merge DID land around now, it is untagged").
            #     Failing here suppresses the one signal built to catch this.
            #   - If the read is WRONG — the merge landed and `gh pr view`
            #     misreported it — exiting strands that commit untagged for good.
            #
            # Exit 0 is better in both directions, so this is an annotation.
            if [ "$merged" = "false" ]; then
              echo "::error::The PR reports not merged (merge command exited ${merge_rc}). No issues closed; check pr-merge.yml and the tag state by hand."

              # The ONE case after the merge command that still exits nonzero,
              # and it is not a reversal of the reasoning above — it is the
              # boundary of it.
              #
              # That reasoning covers the AMBIGUOUS state: gh exited 0 while the
              # PR reads as not-merged. The two signals disagree, either could be
              # the liar, and if the merge did land then exiting strands the
              # commit untagged for good. So `merge_rc = 0` stays green here.
              #
              # When gh ALSO exited nonzero the signals agree, and they agree on
              # the one fact that makes failing safe: nothing landed. No merge
              # commit exists, so there is no tag to lose and nothing for the
              # close block to close. Staying green would cost the red run that
              # two separate places still promise — the `match-head-commit` input
              # description in this file ("fails the job loudly", and it is the
              # only thing standing between an unreviewed commit and a caller's
              # main), and pr-merge.yml's "the run goes RED and the PR stays
              # open". An earlier revision of this commit swallowed every merge
              # failure, including a conflict and a stale head, and turned both
              # of those promises into annotations on a green run.
              #
              # This is the same rule the `auto` path is left bare for: nothing
              # landed there either, so failing is correct.
              if [ "$merge_rc" -ne 0 ]; then
                exit 1
              fi
            fi
          fi

          if [ "$MODE" = "direct" ] && [ "${merged:-}" != "true" ] \
             && [ "${merged:-}" != "false" ] && [ "${merged:-}" != "unknown" ]; then
            # A value this script did not anticipate. Saying so is the point: a
            # skipped close that logs nothing is the silent no-op being removed
            # here.
            #
            # `unknown` is excluded because THIS SCRIPT sets it, on the read
            # failure just above, which already emitted its own ::error::.
            # Without the exclusion one failed read produces two annotations,
            # the second reporting an "unexpected" state that nothing outside
            # this file can ever produce.
            echo "::error::Unexpected merge state '${merged:-}' for $PR_URL. Linked issues were NOT closed; verify the merge and close them by hand."
          fi

          if [ "$MODE" = "direct" ] && [ "${merged:-}" = "true" ]; then

            # Each node carries its OWN repository. A closing keyword may be
            # cross-repo (`Closes org/other#5`), so closing against "$REPO"
            # would not merely 404 — where that number exists here too, it
            # would close an unrelated issue in the wrong repo.
            #
            # Be clear about what this does and does not buy: GITHUB_TOKEN is
            # scoped to the issuing repo, so `issues: write` grants nothing in
            # `org/other` and a genuinely cross-repo close will 403 or 404. It
            # cannot succeed without a PAT. Targeting the right repo is still
            # correct — it turns "silently closed the WRONG issue" into a
            # per-issue annotation naming the one that needs a hand.
            #
            # Filter to OPEN. Re-closing a closed issue is not a no-op: it
            # overwrites stateReason and adds timeline noise, so a re-run would
            # rewrite history it did not create.
            # A bounded read truncates SILENTLY, which would put a hole in the
            # one invariant this block keeps — that a missed close is always
            # annotated. So ask for totalCount and emit it as the first line,
            # then the OPEN pairs. One call, and no dependency on a `jq` binary
            # existing on the runner: `gh --jq` is gh's own.
            # Initialised before the read: `set -u` is on, and this is read
            # on a path the read failure does not take.
            read_failed=""
            # One name for the page size. It was a literal `50` in the query
            # and again in the guard below, 37 lines apart with nothing tying
            # them together: raising the query alone would make the guard fire
            # at 51 and annotate "close them by hand" for issues this step had
            # just closed — a false alarm in the one block whose whole point is
            # that its annotations can be trusted.
            PAGE=50
            if ! refs=$(gh api graphql -f query='
              query($owner:String!,$name:String!,$number:Int!,$page:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    closingIssuesReferences(first:$page){
                      totalCount
                      nodes { number state repository { nameWithOwner } }
                    }
                  } } }' \
              -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$PR_NUMBER" \
              -F page="$PAGE" \
              --jq '.data.repository.pullRequest.closingIssuesReferences
                    | "\(.totalCount)",
                      (.nodes[] | select(.state == "OPEN")
                       | "\(.repository.nameWithOwner) \(.number)")')
            then
              # Same rule as every other post-merge command here: a transient
              # 502 or a secondary rate limit must not fail the run.
              echo "::error::Could not read the linked issues for #${PR_NUMBER}; close them by hand."
              refs=""
              read_failed=1
            fi

            # `read`, not `head -n 1`. `pipefail` is on, and `head` exits as
            # soon as it has its line without draining the pipe, so a `refs`
            # bigger than the 64K pipe buffer gives `printf` SIGPIPE, status
            # 141, and `set -e` kills the step — an exit after an irreversible
            # merge, which is the one thing this whole block is built not to do.
            # Unreachable at the page size above (worst case ~7.5K per 50 rows
            # against a 64K buffer,
            # and MEASURED to survive 500 lines / 33K), but the invariant should
            # not be a consequence of a page size set 20 lines away.
            #
            # A herestring always supplies the trailing newline, so `read`
            # returns 0 and does not trip `set -e`. `${refs#*$'\n'}` is NOT a
            # substitute for the second line: a single-line `refs` comes back
            # unchanged and would be read as an issue.
            #
            # `tail -n +2` stays. It cannot SIGPIPE — emitting from line 2 means
            # reading the whole stream — MEASURED at rc=0 over 3M lines.
            IFS= read -r total <<< "$refs"
            linked=$(printf '%s\n' "$refs" | tail -n +2)

            if [ -n "$total" ] && [ "$total" -gt "$PAGE" ]; then
              echo "::error::PR #${PR_NUMBER} links ${total} issues but only the first ${PAGE} were read. Any beyond ${PAGE} were NOT closed; close them by hand."
            fi

            # Three outcomes, not two. `refs=""` on a failed read makes `linked`
            # empty for the same reason a PR with no linked issues does, and
            # collapsing them would print "No open linked issues to close." as
            # fact directly beneath the ::error:: saying the read failed. That is
            # the same conflation this step already refuses one screen up, where
            # `unknown` and `false` get different annotations: "I could not find
            # out" and "there is nothing there" are different facts.
            #
            # A flag rather than testing `[ -z "$total" ]`. That test would work
            # today — on success `--jq` always emits totalCount, so `refs` holds
            # at least "0" — but it silently depends on totalCount staying the
            # FIRST line of that jq expression, and nothing would fail if a later
            # edit reordered it.
            if [ -n "$read_failed" ]; then
              echo "Linked issues for #${PR_NUMBER} are UNKNOWN: the read above failed. Nothing was closed; see the error annotation."
            elif [ -z "$linked" ]; then
              echo "No open linked issues to close."
            else
              # NEVER let a failed close fail this step, however tempting it is
              # to be strict here. By this point the merge has ALREADY landed
              # and cannot be undone, and tag-release.yml triggers on
              # `workflow_run.conclusion == 'success'` — a GITHUB_TOKEN merge
              # raises no `push` event, so that workflow_run is the ONLY
              # trigger the merge commit will ever get. Exiting nonzero because
              # one issue was locked, transferred, or hit a transient API error
              # would leave that commit permanently untagged, with no retry
              # path. A missed close is an annotation; a missed tag is
              # unrecoverable.
              #
              # `::error::` rather than `::warning::` so a miss shows as a red
              # annotation on an otherwise green run — an annotation does not
              # change the job conclusion, so this buys visibility, not a red
              # run — while the exit code stays 0 and tagging proceeds.
              while read -r issue_repo issue; do
                # The one place in this block that could skip without saying so, in a
                # block whose whole thesis is that a close which does not happen is
                # always annotated. Unreachable today — `nameWithOwner` is never empty
                # and command substitution strips the trailing newline off `linked` —
                # but "unreachable" is why it would stay silent if it ever happened.
                if [ -z "$issue" ]; then
                  echo "::error::Malformed linked-issue row for #${PR_NUMBER}: '${issue_repo}'. Close any remaining linked issues by hand."
                  continue
                fi
                # `completed`, explicitly. The default reason reads as
                # abandoned, which is wrong for work that just shipped.
                # `</dev/null` because this loop's stdin is the herestring that
                # `read` is consuming. `gh issue close` does not read stdin as
                # invoked here — the comment is inline via `--comment`, GH_TOKEN
                # is in the step env so there is no auth prompt, and the runner is
                # non-TTY — so this changes nothing today. It is here because a
                # future flag that DID read stdin would swallow the rest of the
                # list and skip every issue after the first, with no annotation:
                # a silent miss, which is the one failure mode this block exists
                # to make impossible.
                if gh issue close "$issue" --repo "$issue_repo" --reason completed \
                     --comment "Closed by ${REPO}#${PR_NUMBER} on merge." </dev/null
                then
                  echo "Closed ${issue_repo}#${issue}, linked by #${PR_NUMBER}"
                else
                  echo "::error::Could not close ${issue_repo}#${issue}, linked by #${PR_NUMBER}. The merge succeeded and is being tagged; close this issue by hand."
                fi
              done <<< "$linked"
            fi
          fi
