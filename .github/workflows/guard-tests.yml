name: Guard tests

# The bump-token guard in merge-on-approval.yml is shell inside a `run:` block,
# in the one path this repo has with no retry: a nonzero exit after the merge
# costs the release tag outright. `uses:` resolves through GitHub, so the guard
# cannot be exercised from a local checkout — the suite extracts the block
# verbatim from the shipped YAML and runs it against a stubbed `gh`.
#
# It also runs actionlint over every workflow in the repo, so the shell in a
# `run:` block is linted before it ships to a caller rather than after. Both
# checks live in the SAME `guard` job on purpose: `guard` is the one required
# status check on `main`, so a step added here is enforced immediately, while a
# new job would report and gate nothing until branch protection is edited.
#
# Deliberately its OWN workflow rather than a job in pr-checks.yml. That file
# names itself in its own `paths-ignore`, so a PR touching only it creates no
# run object at all and cannot land itself. A separate file has no such
# constraint and can be changed in an ordinary PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: guard-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract the guard from the YAML and run both suites
        # Both suites re-extract before running, so this can never pass against
        # a stale copy. run.sh covers the shell against a stubbed `gh` that
        # asserts argv shape; jqtest.sh covers the `--jq` program against real
        # jq, which the stub is structurally blind to because the program rides
        # inside argv.
        run: bash tests/guard/all.sh

      # The pnpm guard is a separate slice with its own extractor, so it gets
      # its own step rather than joining all.sh: a failure here means the
      # pnpm-version branch logic moved, which is a different diagnosis from a
      # bump-token guard failure and should not arrive wearing its name.
      #
      # extract.sh also asserts the three shipped copies are byte-identical, so
      # this step fails on drift between the workflows as well as on a broken
      # branch. That matters because the guard runs in every caller and only
      # one copy is exercised here.
      - name: Extract the pnpm-version guard from the YAML and run its suite
        run: bash tests/pnpm-guard/run.sh

      # check-workflows.py runs in this same job below and is what makes its
      # assertions binding fleet-wide. That is also why it needs cases of its
      # own: a false positive in it reds the one required check on main and
      # blocks the bot merge on every PR at once, and two of its regexes have
      # already shipped broken here -- one double-escaped and matched nothing,
      # one matched prose instead of `uses:` lines. A clean tree passing proves
      # the happy path and nothing else.
      #
      # Offline: every case that reaches the network stubs fetch_json, and the
      # ones that do not stub it never set CHECK_PNPM_BOOTSTRAP.
      - name: Fixture cases for the workflow checks themselves
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 tests/check-workflows/run.py

      # The pnpm pin is a three-way agreement -- one `pnpm-version` default,
      # one `pnpm/action-setup@<sha>`, and that SHA's bootstrap version -- and
      # the fault it guards against passes its own PR: the first job writes the
      # broken shared-store entry, a later one trips over it. So it cannot be
      # caught by running anything, only by asserting it.
      #
      # CHECK_PNPM_BOOTSTRAP=1 makes the script read the action's committed
      # bootstrap lockfiles at the pinned SHA, through the GitHub contents API.
      # An unreachable lockfile is a hard failure here by DEFAULT -- nothing in
      # this step has to ask for that -- because a Dependabot SHA bump is
      # exactly the automated path that would otherwise move the bootstrap out
      # from under the default with every static assertion still green. Only
      # the pre-push hook opts out, by setting PNPM_BOOTSTRAP_SOFT=1, so an
      # offline push is not blocked by a check that never disagreed.
      #
      # That direction is deliberate. This step used to get its strictness from
      # ambient CI, which made the required check depend on a variable it never
      # declared: tidy the env: block, or move this to a job that does not
      # export it, and the gate silently becomes a green no-op. Now silence
      # needs an affirmative opt-in, and check-workflows.py asserts this step
      # does not take it.
      #
      # GITHUB_TOKEN below goes to api.github.com, NOT raw.githubusercontent.com
      # — see fetch_json() for why that distinction is load-bearing rather than
      # incidental. Three attempts with backoff, so one blip is not a wedged
      # required check.
      - name: Static checks over the workflows (incl. the pnpm pin)
        env:
          CHECK_PNPM_BOOTSTRAP: "1"
          # No PNPM_BOOTSTRAP_SOFT here, on purpose: its absence is what makes
          # an unreachable lockfile red. check-workflows.py fails if this step
          # ever sets it, so the opt-out cannot be added back by a tidy-up.
          #
          # Raises the contents-API limit from 60 to 1000 requests/hour. It goes
          # to api.github.com, NOT raw.githubusercontent.com -- see fetch_json()
          # for the measured reason that distinction is load-bearing: raw
          # answers 404, not 200, to an Authorization header it cannot validate,
          # and github.token carries no grant on pnpm/action-setup.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 scripts/check-workflows.py

      # actionlint parses every workflow and hands each `run:` block to
      # shellcheck. Pinned by version AND sha256: an unpinned download makes
      # the gate's verdict depend on whatever upstream published this morning,
      # and a lint gate that changes its mind on its own is one people learn to
      # ignore. Bump both values together.
      #
      # The shellcheck probe is not ceremony. actionlint SKIPS its shell checks
      # entirely when it cannot find shellcheck on PATH, and still exits 0 — so
      # without this the step would go green over a lint that never ran. It is
      # preinstalled on ubuntu-latest; the probe catches an image change.
      - name: Lint every workflow (actionlint + shellcheck)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is not on PATH — actionlint would skip every shell check and still exit 0."
            exit 1
          fi
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tgz}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tgz}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tgz}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tgz}" -C "${RUNNER_TEMP}" actionlint
          # No path argument: actionlint discovers every workflow in the repo,
          # so a newly added file is covered without editing this step.
          "${RUNNER_TEMP}/actionlint" -color
