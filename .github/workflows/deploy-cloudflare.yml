name: Deploy to Cloudflare (reusable)

# Deploys one Cloudflare Worker with wrangler.
#
# The workflow is deliberately command-shaped rather than framework-shaped: it
# takes shell strings for build/migrate/deploy instead of trying to detect
# whether the caller is a plain Worker, an OpenNext Next.js app or something
# else. Detection would have to grow a branch per framework, and the caller
# already knows the answer.
#
# Ordering is the part that is NOT configurable, because getting it wrong is
# silent rather than loud:
#
#   install -> build -> migrate -> reference data -> budget gate -> deploy
#     -> secrets check -> startup gate -> cron check -> verify
#
# Migrations and reference data run BEFORE the deploy on purpose. A Worker whose
# schema or KV is not there yet does not fail to start — it answers requests
# wrongly (a 503 naming a missing key, a query against a missing table), which
# looks like an application bug rather than a deploy that ran out of order.
#
# Runtime secrets (`WORKER_SECRETS`) ship WITH the deploy, via wrangler's
# `--secrets-file`, rather than as a separate `wrangler secret bulk` step. Two
# reasons: `secret bulk` after a deploy publishes a *second* version, so there
# is a window where the new code is live against the old credentials; and it
# needs the Worker to already exist, which is false on a first-ever deploy.
# `--secrets-file` applies additively — a secret the caller stops passing is
# not deleted from the Worker.

on:
  workflow_call:
    inputs:
      working-dir:
        description: Directory containing wrangler.jsonc / wrangler.toml
        type: string
        default: "."
      install-dir:
        description: |
          Directory to install dependencies from. Defaults to `working-dir`.
          Set to the repo root for a monorepo, where the lockfile lives above
          the Worker being deployed.
        type: string
        default: ""
      environment:
        description: |
          GitHub environment to run the deploy job in. Empty (the default) runs
          with no environment, which is the prior behaviour. Set it to attach
          protection rules or environment-scoped secrets.
        type: string
        default: ""
      node-version:
        description: Node.js version to set up
        type: string
        default: "26"
      package-manager:
        description: Package manager. "auto" detects from lockfile (pnpm > yarn > bun > npm).
        type: string
        default: auto
      pnpm-version:
        description: pnpm major version (used only when package-manager resolves to pnpm)
        type: string
        default: "10"
      build-command:
        description: |
          Shell command that produces the deployable output, run in
          `working-dir`. Empty (the default) skips the step — a plain Worker is
          bundled by `wrangler deploy` itself and needs no separate build.
        type: string
        default: ""
      pre-deploy-command:
        description: |
          Shell command run in `working-dir` after the build and before the
          deploy — database migrations, publishing reference data, anything the
          new code expects to already exist. Empty (the default) skips it.
        type: string
        default: ""
      deploy-command:
        description: Shell command that performs the deploy, run in `working-dir`
        type: string
        default: "npx wrangler deploy"
      max-gzip-kib:
        description: |
          Fail before deploying if the bundle's gzip size exceeds this many KiB.
          0 (the default) disables the gate. Cloudflare's own ceiling is 3 MiB
          gzip on the paid plans; set this well under it so growth is caught
          while there is still room to react.
        type: number
        default: 0
      max-startup-ms:
        description: |
          Fail the job if wrangler reports a startup time above this many ms.
          0 (the default) disables the gate.

          This gate necessarily runs AFTER the deploy: startup time is measured
          by the upload itself and is not reported by `--dry-run`. So it does
          not prevent a slow version going live — it makes the next merge fail
          loudly instead of letting cold-start creep continue unnoticed until it
          hits the hard 1 s limit and the deploy dies with
          `10021 Script startup exceeded CPU time limit`.
        type: number
        default: 0
      verify-url:
        description: |
          URL to GET after deploying. The job fails unless it answers 2xx within
          `verify-attempts`. Empty (the default) skips verification — but a
          deploy nobody checked is not a deploy anybody trusts.
        type: string
        default: ""
      verify-attempts:
        description: How many times to poll `verify-url` before giving up (5 s apart)
        type: number
        default: 12
      expect-crons:
        description: |
          Comma-separated cron expressions this deploy must leave registered on
          the Worker, e.g. `0 * * * *` or `0 * * * *,30 3 * * *`. Empty (the
          default) skips the check.

          Set it for a Worker whose only entrypoint is `scheduled()`.
          `verify-url` cannot cover that case — there is no HTTP surface to
          curl — and nothing else in this workflow looks at schedules, so an
          absent or misplaced `triggers.crons` block deploys green and the
          failure only surfaces later as "the job never ran".
        type: string
        default: ""
      worker-name:
        description: |
          Script name to query for `expect-crons`. Empty (the default) resolves
          it from the deploy output, then from `name` in the wrangler config.
          Set it only when that resolution fails.
        type: string
        default: ""
      runner:
        description: |
          Self-hosted ARC scale-set label for the runner pool. Defaults to
          `arc-df-shared-workflows`; each caller normally pins its own
          scale-set (e.g. `arc-df-dosar-rapid`).
        type: string
        default: "arc-df-shared-workflows"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      WORKER_SECRETS:
        description: |
          Runtime secrets to publish onto the Worker with this deploy, as either
          `KEY=VALUE` lines or a JSON object of string values. Empty (the
          default) skips the whole mechanism.

          The caller composes this from its own GitHub repo secrets — a block
          of `NAME=<expression>` lines, one per secret. See the README for a
          copyable example; it is not reproduced here because an expression
          written in this description would be evaluated as one, and the
          `secrets` context is not available in the `on:` block.

          Prefer the `KEY=VALUE` form: wrangler tries JSON first and falls back
          to dotenv, and the JSON form would need every value escaped correctly
          by the caller. Values must be single-line either way.

          Only the secret NAMES are ever printed. GitHub masks the values in
          logs, but the workflow does not echo them regardless.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Lifted to job level because the `secrets` context is not available in a
      # step-level `if:`, but `env` is.
      WORKER_SECRETS: ${{ secrets.WORKER_SECRETS }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve install directory
        id: dirs
        env:
          INSTALL_DIR: ${{ inputs.install-dir }}
          WORKING_DIR: ${{ inputs.working-dir }}
        run: |
          set -eu
          echo "install=${INSTALL_DIR:-$WORKING_DIR}" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        id: pm
        working-directory: ${{ steps.dirs.outputs.install }}
        env:
          PM_INPUT: ${{ inputs.package-manager }}
        run: |
          set -eu
          if [ "$PM_INPUT" != "auto" ]; then
            echo "pm=$PM_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if   [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];      then echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then echo "pm=bun" >> "$GITHUB_OUTPUT"
          else                              echo "pm=npm"  >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        env:
          # The action's self-installer shells out to `npm install` against
          # registry.npmjs.org, so npm_config_* applies. `audit` is the
          # important one: npm audits by default after install, which POSTs to
          # /-/npm/v1/security/audits — the endpoint that accepts a request and
          # never answers during npm advisory-API incidents, turning a ~5s step
          # into a multi-minute hang (see issue #24). The retry budget covers
          # the package fetch itself.
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_fetch_retries: "5"
          npm_config_fetch_timeout: "120000"
          npm_config_fetch_retry_maxtimeout: "120000"
        with:
          version: ${{ inputs.pnpm-version }}

      - if: steps.pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      # No `cache:` — the ARC runners mount a persistent node-local store, so a
      # restore round-trips it through the in-cluster cache service for nothing.
      # Same reasoning as node-test.yml's package-manager-cache default.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ steps.dirs.outputs.install }}
        run: |
          set -eu
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            bun)  bun install --frozen-lockfile ;;
          esac

      - if: inputs.build-command != ''
        name: Build
        working-directory: ${{ inputs.working-dir }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -eu
          sh -c "$BUILD_COMMAND"

      - if: inputs.pre-deploy-command != ''
        name: Pre-deploy (migrations, reference data)
        working-directory: ${{ inputs.working-dir }}
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
        run: |
          set -eu
          sh -c "$PRE_DEPLOY_COMMAND"

      - if: inputs.max-gzip-kib > 0
        name: Bundle budget gate
        working-directory: ${{ inputs.working-dir }}
        env:
          MAX_GZIP_KIB: ${{ inputs.max-gzip-kib }}
        run: |
          set -euo pipefail
          # `--dry-run` bundles without uploading, so this fails BEFORE anything
          # goes live. It reports size but never startup time, which is why the
          # startup gate is a separate step after the deploy.
          npx wrangler deploy --dry-run --outdir .wrangler-budget 2>&1 | tee budget.log

          # Wrangler colourises its output; strip ANSI before matching or the
          # number never parses and the gate silently passes on an empty value.
          gzip_kib="$(sed 's/\x1b\[[0-9;]*m//g' budget.log \
            | grep -oE 'gzip:[[:space:]]*[0-9]+(\.[0-9]+)?[[:space:]]*KiB' \
            | tail -1 | grep -oE '[0-9]+(\.[0-9]+)?' || true)"

          if [ -z "$gzip_kib" ]; then
            echo "::error::Could not read a gzip size from wrangler output — the budget gate cannot be trusted, so failing rather than passing blind"
            exit 1
          fi

          echo "Bundle: ${gzip_kib} KiB gzip (ceiling ${MAX_GZIP_KIB} KiB)"
          if awk -v a="$gzip_kib" -v b="$MAX_GZIP_KIB" 'BEGIN{exit !(a>b)}'; then
            echo "::error::Bundle is ${gzip_kib} KiB gzip, over the ${MAX_GZIP_KIB} KiB budget"
            exit 1
          fi
          echo "bundle_gzip_kib=${gzip_kib}" >> "$GITHUB_ENV"

      - if: env.WORKER_SECRETS != ''
        name: Stage runtime secrets
        run: |
          set -euo pipefail
          # Outside the checkout so it cannot be picked up by a build, and
          # created with a restrictive umask before anything is written to it.
          umask 077
          secrets_file="${RUNNER_TEMP}/worker-secrets.env"
          printf '%s\n' "$WORKER_SECRETS" > "$secrets_file"

          # Names only — never the values. Also the point at which a payload
          # that arrived empty or malformed is caught: `wrangler secret bulk`
          # silently no-ops on unparseable input, and `--secrets-file` would
          # deploy with no secrets attached and still report success.
          names="$(grep -oE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=' "$secrets_file" \
            | tr -d ' =' || true)"
          if [ -z "$names" ]; then
            names="$(grep -oE '"[A-Za-z_][A-Za-z0-9_]*"[[:space:]]*:' "$secrets_file" \
              | tr -d '":' | tr -d ' ' || true)"
          fi
          if [ -z "$names" ]; then
            echo "::error::WORKER_SECRETS was set but no secret names could be parsed from it. Expected KEY=VALUE lines or a JSON object of string values."
            exit 1
          fi

          echo "Staging $(printf '%s\n' "$names" | wc -l) secret(s):"
          printf '  %s\n' $names

          {
            echo "WORKER_SECRETS_FILE=${secrets_file}"
            echo "WORKER_SECRET_NAMES=$(printf '%s' "$names" | tr '\n' ' ')"
          } >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        working-directory: ${{ inputs.working-dir }}
        env:
          DEPLOY_COMMAND: ${{ inputs.deploy-command }}
        run: |
          set -euo pipefail
          # `--secrets-file` is appended rather than baked into the default
          # command so that a caller overriding `deploy-command` (e.g. to run
          # `wrangler versions upload`) still gets its secrets. Both commands
          # accept the flag.
          sh -c "$DEPLOY_COMMAND${WORKER_SECRETS_FILE:+ --secrets-file \"$WORKER_SECRETS_FILE\"}" 2>&1 | tee deploy.log

      - if: always() && env.WORKER_SECRETS_FILE != ''
        name: Shred the staged secrets file
        run: |
          set -eu
          shred -u "$WORKER_SECRETS_FILE" 2>/dev/null || rm -f "$WORKER_SECRETS_FILE"

      - if: env.WORKER_SECRET_NAMES != ''
        name: Confirm the secrets landed on the Worker
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The deploy reporting success is not evidence the secrets attached —
          # so ask the account which secrets the Worker now has. Names only;
          # `secret list` never returns values.
          live="$(npx wrangler secret list --format json 2>/dev/null \
            | tr -d ' \n' | grep -oE '"name":"[A-Za-z0-9_]+"' | cut -d'"' -f4 || true)"

          missing=""
          for want in $WORKER_SECRET_NAMES; do
            printf '%s\n' "$live" | grep -qx "$want" || missing="$missing $want"
          done

          if [ -n "$missing" ]; then
            echo "::error::Deployed, but these secrets are not on the Worker:$missing"
            exit 1
          fi
          echo "All staged secrets present on the Worker: $WORKER_SECRET_NAMES"

      - if: inputs.max-startup-ms > 0
        name: Startup time gate
        working-directory: ${{ inputs.working-dir }}
        env:
          MAX_STARTUP_MS: ${{ inputs.max-startup-ms }}
        run: |
          set -euo pipefail
          startup_ms="$(sed 's/\x1b\[[0-9;]*m//g' deploy.log \
            | grep -oiE 'startup time:[[:space:]]*[0-9]+[[:space:]]*ms' \
            | tail -1 | grep -oE '[0-9]+' || true)"

          if [ -z "$startup_ms" ]; then
            # Not every wrangler version prints this on every deploy. A missing
            # measurement is not a breach, so warn rather than fail — but say so,
            # because a gate that quietly stopped measuring is worse than none.
            echo "::warning::wrangler reported no startup time; the ${MAX_STARTUP_MS} ms gate did not run"
            exit 0
          fi

          echo "Worker startup: ${startup_ms} ms (ceiling ${MAX_STARTUP_MS} ms)"
          if [ "$startup_ms" -gt "$MAX_STARTUP_MS" ]; then
            echo "::error::Startup time ${startup_ms} ms is over the ${MAX_STARTUP_MS} ms budget. The hard limit is 1000 ms, past which deploys fail with 10021 Script startup exceeded CPU time limit. This version IS already live — the gate runs after upload because only the upload measures startup."
            exit 1
          fi

      - if: inputs.expect-crons != ''
        name: Confirm the Cron Triggers registered
        working-directory: ${{ inputs.working-dir }}
        env:
          EXPECT_CRONS: ${{ inputs.expect-crons }}
          WORKER_NAME: ${{ inputs.worker-name }}
        run: |
          set -euo pipefail
          # A green deploy is not evidence the schedules exist. Wrangler treats
          # an absent `triggers` block as "leave whatever is already there
          # alone", so a block under the wrong environment key — or in a config
          # file wrangler never read — uploads cleanly with zero crons and zero
          # warnings. And `wrangler versions upload` does not apply triggers at
          # all; that needs a separate `wrangler triggers deploy`. Either way
          # the failure surfaces an hour later as "the job never ran", with no
          # failed run to point at.
          #
          # So ask the account what is registered instead of reading deploy.log:
          # the log is wrangler-version-dependent formatting, and on the
          # `versions upload` path it legitimately never mentions schedules.
          # The endpoint needs only Workers Scripts Read, which the token must
          # already exceed to have deployed at all.

          norm() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]][[:space:]]*/ /g'; }

          name="$WORKER_NAME"
          if [ -z "$name" ] && [ -f deploy.log ]; then
            # Both `wrangler deploy` and `wrangler versions upload` print this.
            name="$(sed 's/\x1b\[[0-9;]*m//g' deploy.log \
              | grep -oE '^Uploaded [A-Za-z0-9_.-]+' | tail -1 | cut -d' ' -f2 || true)"
          fi
          if [ -z "$name" ]; then
            # Fallback: the `name` key of whichever config wrangler would read.
            for f in wrangler.jsonc wrangler.json wrangler.toml; do
              if [ -f "$f" ]; then
                name="$(grep -oE '^[[:space:]]*"?name"?[[:space:]]*[:=][[:space:]]*"[^"]+"' "$f" \
                  | head -1 | grep -oE '"[^"]+"$' | tr -d '"' || true)"
                if [ -n "$name" ]; then break; fi
              fi
            done
          fi
          if [ -z "$name" ]; then
            echo "::error::expect-crons is set but the Worker script name could not be resolved from deploy.log or the wrangler config in ${PWD}. Pass worker-name explicitly."
            exit 1
          fi

          body="${RUNNER_TEMP}/worker-schedules.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${name}/schedules" \
            || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::error::Could not read the Cron Triggers of Worker '${name}' (HTTP ${code}). The deploy already happened; this gate did not run."
            head -c 500 "$body" 2>/dev/null || true
            echo
            exit 1
          fi

          # An account with no schedules returns `result.schedules: []`, which is
          # a valid 200 — the empty case has to fall through to the comparison
          # below rather than being treated as "nothing to check".
          live="$(node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!j.success) { console.error(JSON.stringify(j.errors)); process.exit(1); }
            for (const s of (j.result && j.result.schedules) || []) console.log(s.cron);
          ' "$body" | norm)"

          if [ -z "$live" ]; then
            echo "Registered on ${name}: (none)"
          else
            echo "Registered on ${name}:"
            printf '%s\n' "$live" | sed 's/^/  /'
          fi

          missing=""
          # Cron expressions are mostly `*`, so disable globbing before the
          # unquoted split, and split on comma only.
          set -f
          IFS=','
          for want in $EXPECT_CRONS; do
            w="$(printf '%s' "$want" | norm)"
            [ -n "$w" ] || continue
            if ! printf '%s\n' "$live" | grep -qxF "$w"; then
              missing="${missing}${missing:+, }${w}"
            fi
          done
          unset IFS
          set +f

          if [ -n "$missing" ]; then
            echo "::error::Worker '${name}' deployed, but these Cron Triggers are not registered: ${missing}. Check that triggers.crons is in the config wrangler actually read and not scoped to an unused environment; a 'wrangler versions upload' deploy-command needs a follow-up 'wrangler triggers deploy'."
            exit 1
          fi
          echo "All expected Cron Triggers are registered on ${name}."

      - if: inputs.verify-url != ''
        name: Verify the deployed Worker answers
        env:
          VERIFY_URL: ${{ inputs.verify-url }}
          ATTEMPTS: ${{ inputs.verify-attempts }}
        run: |
          set -eu
          # A fresh route can take a few seconds to propagate, so poll rather
          # than assuming the first request is representative.
          i=1
          while [ "$i" -le "$ATTEMPTS" ]; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$VERIFY_URL" || echo 000)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "$VERIFY_URL -> $code after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt ${i}/${ATTEMPTS}: $VERIFY_URL -> $code"
            i=$((i + 1))
            sleep 5
          done
          echo "::error::${VERIFY_URL} never answered 2xx after ${ATTEMPTS} attempts — the deploy reported success but the Worker is not serving"
          exit 1

      - name: Summary
        if: always()
        env:
          WORKING_DIR: ${{ inputs.working-dir }}
          EXPECT_CRONS: ${{ inputs.expect-crons }}
        run: |
          set -eu
          {
            echo "### Cloudflare deploy — \`${WORKING_DIR}\`"
            [ -n "${bundle_gzip_kib:-}" ] && echo "- bundle: ${bundle_gzip_kib} KiB gzip"
            [ -n "${EXPECT_CRONS:-}" ] && echo "- cron triggers asserted: \`${EXPECT_CRONS}\`"
            echo "- deploy command: \`${{ inputs.deploy-command }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
