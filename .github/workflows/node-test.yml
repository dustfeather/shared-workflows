name: Node test (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to set up
        type: string
        default: "26"
      package-manager:
        description: Package manager to use. "auto" detects from lockfile (pnpm > yarn > bun > npm).
        type: string
        default: auto
      pnpm-version:
        description: |
          pnpm version (used only when package-manager resolves to pnpm).
          Effectively single-valued on a runner pool that exports a shared pnpm
          store: any value but the default is rejected before setup, because
          there it is not a preference but a break. Elsewhere it warns and
          proceeds. See the comment below.
        type: string
        # The invariant is NOT "an exact version" and never was. It is: a value
        # pnpm/action-setup can serve from its own committed bootstrap WITHOUT
        # running `pnpm self-update`. The action `rm -rf`s its dest dir and
        # `npm ci`s a bootstrap lockfile every time, so the runner image's pnpm
        # is never consulted; whether self-update then runs is decided by
        # `run.ts` and by nothing else:
        #
        #   const native = targetsPnpm12(targetVersion)   // range ⊆ >=12 <13
        #   const lockfile = native ? nativeLock : standalone ? exeLock : pnpmLock
        #   if (targetVersion === bootstrapVersion ||
        #       (native && satisfies(bootstrapVersion, targetVersion)))
        #     return { exitCode: 0 }
        #
        # Two shapes reach that early return, and "12" is the second one. A
        # request inside pnpm 12 selects the THIRD bootstrap, `native-lock.json`
        # (12.3.4 at the SHA pinned below), and a RANGE is then satisfied by it
        # -- so `pnpm self-update` never runs. An EXACT version only qualifies by
        # equality, which is why `{pnpm,exe}-lock.json`'s 11.25.0 had to be
        # copied here verbatim while the value was an exact one.
        #
        # So the range is the safer shape here, not the looser one, and this is
        # the rare case where "latest" is the wrong ask: `12.5.1` (newest today)
        # equals no bootstrap and is satisfied by none, so it takes the
        # self-update branch. That branch installs pnpm THROUGH pnpm, honouring
        # the container's shared `pnpm_config_store_dir`: the first job writes a
        # store entry missing @pnpm/exe.linux-x64 and every later job reuses it
        # and dies with ERR_PNPM_BROKEN_PNPM_INSTALL. The first run passes, so a
        # green PR is not evidence here.
        #
        # READ THIS BEFORE "we tried 12 and it broke": we did, at v7.0.0, and
        # uninsta's PR was green while its release on main failed minutes later.
        # That was a DIFFERENT action SHA -- 0977fd99, which had no native
        # bootstrap and no short-circuit, so "12" could only mean self-update.
        # The literal is the same; the mechanism underneath it is not. It is safe
        # now because of the SHA on the `uses:` line, so the two move together:
        # scripts/check-workflows.py asserts this default against THAT SHA's
        # native-lock.json, and the guard step below refuses anything else.
        #
        # DO NOT "clarify" this to `>=12.0.0`. That is the trap in this design,
        # because the test is `subset(range, '>=12.0.0 <13.0.0')` and `>=12.0.0`
        # is UNBOUNDED above -- it admits 13.x, so it is not a subset, `native`
        # comes back false, the 11.x bootstrap is selected instead and
        # self-update really runs. Measured against semver, 2026-09-22:
        #
        #   12  ^12.0.0  ~12.3.0  12.x   -> native, no self-update   SAFE
        #   >=12.0.0  >=12        -> NOT native, self-update runs    BREAKS
        #   12.5.1 (exact latest) -> native, equals no bootstrap     BREAKS
        #
        # Of the safe forms the bare major is the widest: any 12.x bootstrap
        # satisfies it, so Dependabot moving the SHA within the major raises the
        # pnpm this serves at no cost here. It is also the only one the guard can
        # compare with string equality in bash.
        default: "12"
      package-manager-cache:
        description: |
          Restore/save the package manager's download cache via
          `actions/setup-node` (`cache: npm|yarn|pnpm`). ON by default since
          v8, because `runner` now defaults to `ubuntu-latest`, which starts
          from an empty store every job and has nothing else to restore from.

          It defaulted to false for as long as every caller ran on the
          self-hosted ARC pool, whose runners mount a persistent node-local
          pnpm/npm store (hostPath on acer-laptop, via
          npm_config_store_dir/npm_config_cache); there the restore round-trips
          that store through the throttled in-cluster GitHub Actions cache
          service (~40s/job) for nothing. Turn it back OFF for a caller still
          pinned to such a pool — the two defaults are opposite for opposite
          reasons, not one of them wrong.

          It is also the off switch when the cache lookup cannot find a
          lockfile: with `cache` set, setup-node FAILS THE STEP rather than
          skipping the cache. The derived glob list covers the lockfile beside
          the package.json and the lockfile at the repo root; a layout neither
          finds needs `cache-dependency-path`, or this set to false. No effect
          when the package manager is bun (setup-node has no bun cache mode).
        type: boolean
        default: true
      working-dir:
        description: Directory containing package.json
        type: string
        default: "."
      cache-dependency-path:
        description: |
          Overrides the glob list `actions/setup-node` hashes for the cache
          key. Newline-separated; paths resolve from the repo root, not from
          `working-dir`. Empty (the default) derives a list covering both the
          lockfile-beside-package.json and the lockfile-at-the-root shapes,
          which is what nearly every caller wants — reach for this only when
          the lockfile is somewhere neither glob finds. Ignored when
          `package-manager-cache` is false, and when the package manager is
          bun (setup-node has no bun cache mode).
        type: string
        default: ""
      script-setup:
        description: |
          package.json script run after install and before every gate —
          codegen, type emission, rendering a config file: anything a later
          script needs on disk but the repo does not track.

          Named `ci:setup` rather than the obvious candidates because both of
          those are already live pnpm lifecycle hooks: with
          `enable-pre-post-scripts` unset, pnpm 10 runs `prepare` on install
          and `prebuild` around `build`. A hook on either name would fire at
          times nobody asked for, and twice when a step also invokes it.

          Left at its default and absent from package.json, the step skips
          silently, so adopting this is a no-op for existing callers. Named
          explicitly and absent, the job fails — see the note on script-lint.
        type: string
        default: "ci:setup"
      script-lint:
        description: |
          package.json script name for lint.

          Every script-* input follows the same rule: left at its default and
          absent from package.json, the gate skips (and says so in the run
          summary); passed explicitly and absent, the job FAILS. Naming a
          script states an expectation, and a typo in that name has to be
          loud — a silently skipped gate reads exactly like a passing one,
          which is the failure mode that produced this rule.
        type: string
        default: lint
      script-test:
        description: package.json script name for tests
        type: string
        default: test
      script-typecheck:
        description: package.json script name for type-checking
        type: string
        default: typecheck
      script-build:
        description: package.json script name for the build step (only run when run-build is true)
        type: string
        default: build
      run-lint:
        type: boolean
        default: true
      run-test:
        type: boolean
        default: true
      run-typecheck:
        type: boolean
        default: true
      run-build:
        description: |
          Run the build script to verify it succeeds end-to-end. On by
          default as of v5, matching run-lint/run-test/run-typecheck: the
          gate turns on script presence alone, and a project with no `build`
          script is unaffected because the step self-skips.

          It defaulted to false through v4, which meant a caller that passed
          nothing got no build gate and a step reporting `skipped` — visually
          identical, on a green run, to one that ran. Reasoning from
          run-test's default to this one did not hold, and `grep run-build`
          in a caller returned nothing, which reads as "no toggle is
          suppressing it" when it means "the default is in force".

          Pass `run-build: false` explicitly to opt out. Worth doing when the
          build needs something the reusable job cannot produce — though
          script-setup now covers most of that.
        type: boolean
        default: true
      run-audit:
        description: |
          Run a dependency vulnerability audit (`npm audit` / `pnpm audit` /
          `yarn audit` / `bun audit`, picked to match the detected package
          manager) and fail the job — and therefore anything gated on it via
          `needs:` (a deploy, a publish) — when a vulnerability at or above
          `audit-level` is present. On by default.
        type: boolean
        default: true
      audit-level:
        description: |
          Minimum severity that fails the audit: low | moderate | high |
          critical. Default high — moderate/low advisories (often in
          transitive dev deps with no fix available) don't block deploys.
        type: string
        default: high
      runner:
        description: |
          Runner label for this job. Defaults to `ubuntu-latest` (GitHub-hosted),
          which is where the whole fleet runs since v8. Pass a self-hosted ARC
          scale-set label (e.g. `arc-df-uninsta`) only for a job that genuinely
          needs the cluster; those pools are now kept alive only for
          deploy-k8s.yml and deploy-helm.yml.
        type: string
        default: "ubuntu-latest"
    secrets:
      NPM_TOKEN:
        description: |
          npm granular access token, read-only with no package/scope/org
          grants. Written into ~/.npmrc as an env-expanded reference, so
          install and audit authenticate to registry.npmjs.org instead of
          running anonymously. Optional — an unset or misnamed secret
          interpolates to the empty string, which is indistinguishable from
          "not configured", so the auth step skips and behaviour is unchanged
          rather than half-authenticated.
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to npm registry
        run: |
          set -u
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN unset — registry calls stay anonymous."
            exit 0
          fi
          # The ${NPM_TOKEN} below is written LITERALLY: npm, pnpm and yarn all
          # expand env references when they READ .npmrc, so the token value
          # never lands on disk, in a cache layer or in an artifact.
          # shellcheck disable=SC2016  # ${NPM_TOKEN} is written literally on purpose — see above.
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' >> "$HOME/.npmrc"
          echo "Wrote registry auth to ~/.npmrc (token read from env at use time)."

      - name: Detect package manager
        id: pm
        env:
          PM_INPUT: ${{ inputs.package-manager }}
        run: |
          if [ "$PM_INPUT" != "auto" ]; then
            echo "pm=$PM_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if   [ -f pnpm-lock.yaml ]; then echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ];      then echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then echo "pm=bun" >> "$GITHUB_OUTPUT"
          else                              echo "pm=npm"  >> "$GITHUB_OUTPUT"
          fi

      # Built in a step rather than inline in `with:` because the value is
      # multi-line, and a ${{ }} expression cannot produce a newline: the
      # obvious `format('{0}/*lock*{1}*lock*', ..., '\n')` emits a literal
      # backslash-n. Runs at the job's default working-directory, so the
      # globs are written from `working-dir` as a VALUE — setup-node resolves
      # them against GITHUB_WORKSPACE, not against the step's cwd.
      - name: Derive the lockfile globs for the cache key
        id: cachedeps
        env:
          OVERRIDE: ${{ inputs.cache-dependency-path }}
          WORKING_DIR: ${{ inputs.working-dir }}
        working-directory: .
        run: |
          set -eu
          {
            echo "globs<<CACHEDEPS_EOF"
            if [ -n "$OVERRIDE" ]; then
              printf '%s\n' "$OVERRIDE"
            else
              printf '%s/*lock*\n*lock*\n' "$WORKING_DIR"
            fi
            echo "CACHEDEPS_EOF"
          } >> "$GITHUB_OUTPUT"

      # A caller can pass any string, and the static check in
      # scripts/check-workflows.py cannot see it -- it only compares the defaults
      # declared in this repo. "12" was the shipped default in v7.0.0, so a repo
      # that pinned it explicitly while debugging those failures would keep the
      # exact break the pin fixes, and the floating @v7 tag would look inert.
      #
      # Fail here, before the action runs, rather than at the ERR_PNPM_BROKEN_
      # PNPM_INSTALL that lands on the SECOND job with nothing naming the cause.
      # PNPM_BOOTSTRAP_VERSION must equal the pnpm-version default above;
      # scripts/check-workflows.py asserts that it does.
      - name: Reject a pnpm-version the pinned action does not bootstrap
        if: steps.pm.outputs.pm == 'pnpm'
        env:
          PNPM_BOOTSTRAP_VERSION: "12"
          REQUESTED: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail
          # pnpm-guard-slice-begin -- tests/pnpm-guard/extract.sh re-extracts
          # everything between these markers from all three workflows, asserts
          # the three copies are byte-identical, and runs the result. Anchor on
          # the markers, never on a line of the code under test: an edit that
          # removes the anchor makes the extractor silently slice somewhere
          # else, and the suite then reports ordinary-looking failures against
          # code nobody is testing.
          if [ "$REQUESTED" = "$PNPM_BOOTSTRAP_VERSION" ]; then
            exit 0
          fi
          # The poisoning needs a store SHARED between jobs -- that is what makes
          # one job's bad entry another job's crash. On the ARC pools that is
          # pnpm_config_store_dir, exported at container level (k3s-cluster
          # bootstrap/values-common.yaml). Without it -- runner: ubuntu-latest,
          # or any pool not exporting it -- the self-installer writes to a
          # per-job store and nothing breaks, so refusing there would be a hard
          # failure with no underlying bug. Warn instead: the value is still
          # wrong, it is just not fatal here.
          if [ -z "${pnpm_config_store_dir:-}" ]; then
            echo "::warning::pnpm-version is '$REQUESTED' rather than $PNPM_BOOTSTRAP_VERSION, which is what the pinned action serves without self-updating, so pnpm/action-setup will run 'pnpm self-update'. Harmless on this runner because no shared pnpm store is exported, but it breaks every job after the first on a pool that exports pnpm_config_store_dir. Drop the input to take the default."
            exit 0
          fi
          echo "::error::pnpm-version is '$REQUESTED', but the only value pnpm/action-setup serves from its own committed bootstrap at the SHA pinned in this workflow, without running 'pnpm self-update', is $PNPM_BOOTSTRAP_VERSION. Any other value takes the self-update branch -- INCLUDING a newer exact pnpm, which equals no bootstrap and so is the usual way into this. That branch installs pnpm THROUGH pnpm into the shared pnpm_config_store_dir. The first job succeeds and every later one dies with ERR_PNPM_BROKEN_PNPM_INSTALL. Remove the pnpm-version input to take the default."
          exit 1
          # pnpm-guard-slice-end

      - if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          # The action's self-installer shells out to `npm install` against
          # registry.npmjs.org, so npm_config_* applies. `audit` is the
          # important one: npm audits by default after install, which POSTs to
          # /-/npm/v1/security/audits — the endpoint that accepts a request and
          # never answers during npm advisory-API incidents, turning a ~5s step
          # into a multi-minute hang (see issue #24). The retry budget covers
          # the package fetch itself.
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_fetch_retries: "5"
          npm_config_fetch_timeout: "120000"
          npm_config_fetch_retry_maxtimeout: "120000"
        with:
          version: ${{ inputs.pnpm-version }}

      - if: steps.pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      # setup-node `cache` accepts npm/yarn/pnpm but not bun. Skip cache for
      # bun. An empty `cache` value disables caching, so when
      # package-manager-cache is false we pass '' and setup-node does no
      # restore/save.
      #
      # `cache-dependency-path` is not an optimisation here, it is what stops
      # the cache default from being a hard break. With `cache` set and this
      # unset, setup-node looks for the lockfile in GITHUB_WORKSPACE ONLY — no
      # recursive search — and THROWS `Dependencies lock file is not found in
      # /home/runner/work/<repo>/<repo>` rather than skipping the cache, so
      # every caller with its lockfile under `working-dir` and none at the
      # root would fail the step outright on v8 having been green on v7.
          # Two globs, newline-separated, because a single one is wrong for
          # half the input space either way. setup-node hashes whatever the
          # list resolves to and only fails when NOTHING resolves, so the pair
          # covers the self-contained subdirectory (lockfile beside the
          # package.json) and the workspace (one lockfile at the repo root,
          # `working-dir` pointing at a member) without the caller choosing.
          # With just the subdirectory glob a pnpm workspace fails
          # `Some specified paths were not resolved, unable to cache
          # dependencies`; with just the root glob the subdirectory shape fails
          # `Dependencies lock file is not found`. Both are hard step failures,
          # not cache misses. A repo with no lockfile anywhere is not a new
          # break — every install branch below already requires one.
      - if: steps.pm.outputs.pm != 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager-cache && steps.pm.outputs.pm || '' }}
          cache-dependency-path: ${{ steps.cachedeps.outputs.globs }}
      - if: steps.pm.outputs.pm == 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: |
          case "${{ steps.pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            bun)  bun install --frozen-lockfile ;;
          esac

      # Detection moved ahead of the audit in v5: the setup script runs before
      # everything else, and whether it exists has to be known before it can.
      - name: Detect which scripts exist in package.json
        id: scripts
        env:
          SETUP: ${{ inputs.script-setup }}
          LINT:  ${{ inputs.script-lint }}
          TEST:  ${{ inputs.script-test }}
          TC:    ${{ inputs.script-typecheck }}
          BLD:   ${{ inputs.script-build }}
        run: |
          has() { jq -e --arg s "$1" '.scripts[$s] // empty' package.json >/dev/null 2>&1 && echo true || echo false; }
          {
            echo "has_setup=$(has "$SETUP")"
            echo "has_lint=$(has "$LINT")"
            echo "has_test=$(has "$TEST")"
            echo "has_typecheck=$(has "$TC")"
            echo "has_build=$(has "$BLD")"
          } >> "$GITHUB_OUTPUT"

      # A caller that NAMES a script states an expectation, so a typo in that
      # name has to be loud: a skipped gate and a passing one are the same
      # colour on a green run. `workflow_call` exposes no "was this input
      # supplied" flag, so value != default is the only available proxy —
      # passing a script-* input explicitly AT its default is indistinguishable
      # from not passing it at all and stays silent. That gap only ever
      # under-reports; it cannot fail a caller who did nothing wrong.
      - name: Verify explicitly named scripts exist
        env:
          SETUP: ${{ inputs.script-setup }}
          LINT:  ${{ inputs.script-lint }}
          TEST:  ${{ inputs.script-test }}
          TC:    ${{ inputs.script-typecheck }}
          BLD:   ${{ inputs.script-build }}
          HAS_SETUP: ${{ steps.scripts.outputs.has_setup }}
          HAS_LINT:  ${{ steps.scripts.outputs.has_lint }}
          HAS_TEST:  ${{ steps.scripts.outputs.has_test }}
          HAS_TC:    ${{ steps.scripts.outputs.has_typecheck }}
          HAS_BLD:   ${{ steps.scripts.outputs.has_build }}
        run: |
          set -u
          missing=()
          # $1 input name, $2 supplied value, $3 this input's default, $4 has_*
          check() {
            if [ "$2" != "$3" ] && [ "$4" != "true" ]; then
              missing+=("$1 names '$2'")
            fi
          }
          check script-setup     "$SETUP" "ci:setup"  "$HAS_SETUP"
          check script-lint      "$LINT"  "lint"      "$HAS_LINT"
          check script-test      "$TEST"  "test"      "$HAS_TEST"
          check script-typecheck "$TC"    "typecheck" "$HAS_TC"
          check script-build     "$BLD"   "build"     "$HAS_BLD"
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error::$m, but package.json has no such script."
            done
            exit 1
          fi

      # Runs before the audit so that everything downstream — audit included —
      # sees whatever it puts on disk. Skips silently when the script is
      # absent; the step above is what makes a misnamed one fail instead.
      - if: steps.scripts.outputs.has_setup == 'true'
        name: Setup
        env: { PM: "${{ steps.pm.outputs.pm }}", SCRIPT: "${{ inputs.script-setup }}" }
        run: |
          case "$PM" in
            pnpm) pnpm run "$SCRIPT" ;;
            npm)  npm run "$SCRIPT" ;;
            yarn) yarn run "$SCRIPT" ;;
            bun)  bun run "$SCRIPT" ;;
          esac

      - if: inputs.run-audit
        name: Audit dependencies
        env:
          PM: ${{ steps.pm.outputs.pm }}
          LEVEL: ${{ inputs.audit-level }}
          # npm's advisory endpoint (/-/npm/v1/security/audits) intermittently
          # accepts a request and never answers. The default budget (2 retries,
          # 10s then 60s) gives up after ~4m and fails the step, which skips
          # typecheck/test/build and any deploy job gated on this workflow.
          # npm, pnpm and yarn all honour npm_config_*, so one block covers
          # every branch of the case below.
          npm_config_fetch_retries: "5"
          npm_config_fetch_timeout: "120000"
          npm_config_fetch_retry_maxtimeout: "120000"
        run: |
          set -u
          case "$PM" in
            npm)  npm audit --audit-level="$LEVEL" ;;
            pnpm) pnpm audit --audit-level "$LEVEL" ;;
            bun)  bun audit --audit-level "$LEVEL" ;;
            yarn)
              if yarn --version | grep -q '^1\.'; then
                # Yarn Classic's `yarn audit` exit code is a severity
                # bitmask (1 info, 2 low, 4 moderate, 8 high, 16 critical),
                # OR-ed together — nonzero even for advisories below LEVEL.
                # Re-derive pass/fail from the bits at/above LEVEL.
                yarn audit --level "$LEVEL"; code=$?
                case "$LEVEL" in
                  low)      mask=30 ;;  # 2|4|8|16
                  moderate) mask=28 ;;  # 4|8|16
                  high)     mask=24 ;;  # 8|16
                  critical) mask=16 ;;
                  *)        mask=24 ;;  # treat unknown as "high"
                esac
                if [ $((code & mask)) -ne 0 ]; then exit 1; fi
              else
                yarn npm audit --severity "$LEVEL" --all
              fi
              ;;
          esac

      - if: inputs.run-lint && steps.scripts.outputs.has_lint == 'true'
        name: Lint
        env: { PM: "${{ steps.pm.outputs.pm }}", SCRIPT: "${{ inputs.script-lint }}" }
        run: |
          case "$PM" in
            pnpm) pnpm run "$SCRIPT" ;;
            npm)  npm run "$SCRIPT" ;;
            yarn) yarn run "$SCRIPT" ;;
            bun)  bun run "$SCRIPT" ;;
          esac

      - if: inputs.run-typecheck && steps.scripts.outputs.has_typecheck == 'true'
        name: Type-check
        env: { PM: "${{ steps.pm.outputs.pm }}", SCRIPT: "${{ inputs.script-typecheck }}" }
        run: |
          case "$PM" in
            pnpm) pnpm run "$SCRIPT" ;;
            npm)  npm run "$SCRIPT" ;;
            yarn) yarn run "$SCRIPT" ;;
            bun)  bun run "$SCRIPT" ;;
          esac

      - if: inputs.run-test && steps.scripts.outputs.has_test == 'true'
        name: Test
        env: { PM: "${{ steps.pm.outputs.pm }}", SCRIPT: "${{ inputs.script-test }}" }
        run: |
          case "$PM" in
            pnpm) pnpm run "$SCRIPT" ;;
            npm)  npm run "$SCRIPT" ;;
            yarn) yarn run "$SCRIPT" ;;
            bun)  bun run "$SCRIPT" ;;
          esac

      - if: inputs.run-build && steps.scripts.outputs.has_build == 'true'
        name: Build
        env: { PM: "${{ steps.pm.outputs.pm }}", SCRIPT: "${{ inputs.script-build }}" }
        run: |
          case "$PM" in
            pnpm) pnpm run "$SCRIPT" ;;
            npm)  npm run "$SCRIPT" ;;
            yarn) yarn run "$SCRIPT" ;;
            bun)  bun run "$SCRIPT" ;;
          esac

      - name: Summary of skipped steps
        if: always()
        env:
          HL: ${{ steps.scripts.outputs.has_lint }}
          HT: ${{ steps.scripts.outputs.has_test }}
          HC: ${{ steps.scripts.outputs.has_typecheck }}
          HB: ${{ steps.scripts.outputs.has_build }}
          RL: ${{ inputs.run-lint }}
          RT: ${{ inputs.run-test }}
          RC: ${{ inputs.run-typecheck }}
          RB: ${{ inputs.run-build }}
        run: |
          skipped=()
          [ "$RL" = "true" ] && [ "$HL" = "false" ] && skipped+=("lint(no '${{ inputs.script-lint }}' script)")
          [ "$RT" = "true" ] && [ "$HT" = "false" ] && skipped+=("test(no '${{ inputs.script-test }}' script)")
          [ "$RC" = "true" ] && [ "$HC" = "false" ] && skipped+=("typecheck(no '${{ inputs.script-typecheck }}' script)")
          [ "$RB" = "true" ] && [ "$HB" = "false" ] && skipped+=("build(no '${{ inputs.script-build }}' script)")
          if [ ${#skipped[@]} -gt 0 ]; then
            echo "::notice::Skipped: ${skipped[*]}"
          fi
