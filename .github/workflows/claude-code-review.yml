name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      trusted-actors:
        description: |
          Comma-separated list of GitHub actors whose PRs may trigger reviews.
          Bots from `allowed-bots` are also accepted in addition to this list.
        type: string
        default: dustfeather
      allowed-bots:
        description: |
          Comma-separated list of bots whose PRs may trigger reviews.
          Passed through to claude-code-action's `allowed_bots` input.
        type: string
        default: "dependabot[bot]"
      show-full-output:
        description: |
          Surface every tool call (gh pr view, gh pr diff, gh pr review, MCP
          inline-comment calls, etc.) in the action log instead of hiding the
          agent transcript behind the final result JSON. Defaults to false so
          the action log stays quiet; flip to true per-caller when you need to
          audit the full agent transcript.
        type: boolean
        default: false
      runner:
        description: |
          Runner label for this job. Defaults to `ubuntu-latest` (GitHub-hosted);
          since v8 that is the default for every `runner` input here, where it
          used to be an `arc-*` scale set. Pass a self-hosted scale-set label
          (e.g. `arc-df-uninsta`) only for a job that genuinely needs the
          cluster — `deploy-k8s.yml` and `deploy-helm.yml` are the two that
          always will. A default is not a migration: a caller that passes a
          label keeps its pool, this repo's own shims included.
        type: string
        default: "ubuntu-latest"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# Top-level default: minimum read. Each job widens what it needs.
permissions:
  contents: read

jobs:
  review:
    # Trusted human OR allowlisted bot. The format trick wraps both sides in
    # commas so a substring like "dustfeather" doesn't match "dustfeather2".
    if: |
      contains(format(',{0},', inputs.trusted-actors), format(',{0},', github.actor)) ||
      contains(format(',{0},', inputs.allowed-bots), format(',{0},', github.actor))
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Skip if CodeQL has already failed for this PR
        # Cheap bash gate — no agent spin-up if CodeQL is red. Treats
        # IN_PROGRESS / no-result as "proceed" so we don't block reviews
        # waiting for CodeQL on every PR. Combined with the caller's
        # `needs: tests`, this means review only runs on PRs where both
        # tests and CodeQL are passing-or-still-running.
        id: codeql_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          checks=$(gh pr checks "$PR" --repo "$REPO" --json name,state 2>/dev/null || echo "[]")
          codeql_failed=$(echo "$checks" | jq -r '
            [.[] | select(.name | test("CodeQL"; "i"))
                 | select(.state == "FAILURE")] | length')
          if [ "${codeql_failed:-0}" -gt 0 ]; then
            echo "::warning::Skipping review: CodeQL failed on this PR"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.codeql_gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # This step exists because the workflow used to get code-review-graph
      # from the pre-baked `actions-runner-claude` image and name it nowhere.
      # Anything installed by runner-image/Dockerfile is on PATH for every job
      # on an ARC pool without appearing in the workflow, so the file READ as
      # self-contained while it was not, and moving the default to
      # `ubuntu-latest` in v8 replaces that whole surface at once. The
      # `command -v` guard keeps the ARC pools on the same code path instead
      # of forking into two.
      #
      # `continue-on-error` is deliberate HERE and only here: the agent prompt
      # carries an explicit `gh pr diff` fallback, so a review without the
      # graph is degraded rather than wrong, and blocking every review on a
      # PyPI hiccup would be the worse trade. It is not a licence to bury a
      # failure that has no fallback.
      #
      # CRG_VERSION is a SECOND COPY of the ARG in runner-image/Dockerfile.
      # Bump both together. Nothing at RUNTIME errors when they drift — the
      # two runner types just build the graph with different parsers, and the
      # symptom is "the review got worse on one runner type", which nobody
      # traces back to a version literal. So the agreement is asserted
      # statically instead: scripts/check-workflows.py's
      # runner_image_pin_drift() fails when this value and `ARG CRG_VERSION`
      # disagree, or when the ARG is gone, and that script is a step of the
      # `guard` job — the one required status check on main. Same treatment
      # the pnpm three-way agreement gets, for the same reason.
      - name: Ensure code-review-graph is installed
        if: steps.codeql_gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          CRG_VERSION: "2.3.5"
        run: |
          set -euo pipefail
          if command -v code-review-graph >/dev/null 2>&1; then
            echo "code-review-graph already present: $(code-review-graph --version)"
            exit 0
          fi
          python3 -m pip install --no-cache-dir --break-system-packages \
            "code-review-graph==${CRG_VERSION}"
          code-review-graph --version

      - name: Build code review graph
        # Parses the checkout into code-review-graph's structural graph so the
        # MCP server (wired into claude_args below) can answer blast-radius /
        # impact / review-context queries. continue-on-error so a review is
        # NEVER blocked if the tool is missing or the build fails — the agent
        # prompt falls back to gh pr diff.
        if: steps.codeql_gate.outputs.skip != 'true'
        continue-on-error: true
        run: code-review-graph build

      - name: Run Claude Code Review
        if: steps.codeql_gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          show_full_output: ${{ inputs.show-full-output }}
          # No `path_to_bun_executable` / `path_to_claude_code_executable`.
          # Those pointed at /usr/local/bin/{bun,claude}, which exist only on
          # the pre-baked ARC image; on `ubuntu-latest` the action fails
          # outright rather than falling back. Letting the action install its
          # own Bun and Claude Code costs ~10-25s per job and works on both
          # runner types. A caller still on an ARC pool pays that too — the
          # alternative is a path that is wrong on the default.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            First decide which review track applies:

            DEPENDABOT TRACK — if the PR author is "dependabot[bot]":
              - Read the PR title, body, and diff with `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}`.
              - Identify whether the bump is patch, minor, or major.
              - Skim the linked release notes / changelog from the PR body for breaking changes.
              - Check that the diff is limited to manifest + lockfile (no unrelated source changes).
              - Decision rules:
                  • Patch: approve unless the changelog explicitly calls out a breaking change in this version.
                  • Minor: approve if changelog has no "breaking" / "BREAKING CHANGE" / removed-API language; otherwise request changes.
                  • Major: request changes by default and ask for human review unless the changelog is unambiguously additive (rare).
                  • Group PRs (multiple bumps): apply the strictest rule across all members.
                  • If diff touches anything beyond lockfile + manifest: request changes.
              - Submit the formal review with the gh CLI (NOT a plain comment):
                  gh pr review ${{ github.event.pull_request.number }} --approve --body "<one-sentence reasoning>"
                  OR
                  gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<what needs human attention>"

            STANDARD TRACK — for any other author:
              - Before reading files by hand, use the code-review-graph MCP tools for structural, token-efficient context:
                  • Get changed files: `gh pr diff ${{ github.event.pull_request.number }} --name-only`.
                  • Call detect_changes / get_impact_radius on those files for blast radius, affected execution flows, and missing-test gaps.
                  • Use get_review_context / query_graph / semantic_search_nodes to pull only the relevant code (callers, callees, tests) instead of whole files.
                  • If the graph tools are unavailable or return empty (graph not built — e.g. unsupported language or build skipped), fall back to reading the diff directly with `gh pr diff`.
              - Do the whole review YOURSELF. Do not dispatch subagents — you have no Task tool in this job, and spending
                turns discovering that is how a review ends with nothing posted. Cover these passes in one head:
                  • Correctness and security: logic errors, unhandled inputs, injection, secrets, auth and permission gaps,
                    project-convention violations (read the repo's CLAUDE.md / AGENTS.md if present).
                  • Swallowed failure: bare catch blocks, ignored error returns, fallbacks that mask a real fault, a default
                    that hides a missing value. Skip if the diff touches no error handling.
                  • Test coverage: does a behavioural test exercise the new logic, including its failure paths? Skip if the
                    repo has no test suite.
              - Stay inside the diff. A problem you spotted in untouched code is not this PR's verdict; mention it in the body
                at most once, never as grounds for requesting changes.
              - Budget your turns. The review is worthless if you run out before submitting, so stop investigating and post
                once you can justify a verdict. Depth beyond that point buys nothing.
              - Submit the verdict and every inline finding as ONE atomic review. A single POST means the verdict can never
                land without its comments, or the comments without a verdict:
                  gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" --method POST --input - <<< '{"event":"APPROVE","body":"<one-sentence reasoning>","comments":[{"path":"src/foo.ts","line":42,"side":"RIGHT","body":"<finding>"}]}'
                Keep the JSON on ONE line inside that herestring. Do not reach for a `<<'JSON'` heredoc — its terminator has to
                sit in column 0, which is easy to get wrong and silently swallows the rest of the command. Single-quote the
                herestring so the shell leaves the JSON alone, escape any `"` inside a body as `\"`, and write newlines as `\n`.
                  • "event" is "APPROVE" if the diff is correct, safe, and needs no human follow-up.
                  • "event" is "REQUEST_CHANGES" if anything needs a human to look — correctness/security bug, missing tests,
                    unclear intent, or you are not confident. Minor or trivial items (nits, style, naming, a small cleanup)
                    are also valid grounds; do not soften to an approve just because the issue is small.
                  • Omit "comments" entirely, or pass [], when you have no line-specific findings.
                  • Every "path"/"line" pair MUST name a line that appears in the diff you read, or the whole call 422s and
                    NOTHING is posted. Use "side": "RIGHT" for added/context lines, "LEFT" for deleted ones. For a range, use
                    "start_line" plus "line". Re-read `gh pr diff ${{ github.event.pull_request.number }}` to confirm a line before citing it.
              - If that call fails (422 on a line you cannot place, or any other error you cannot fix in one retry), do NOT
                give up on the verdict — drop the inline comments, fold the findings into the body text, and post the verdict
                alone. Inline comments are best-effort; the verdict is mandatory:
                  gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<what needs human attention>"
                  gh pr review ${{ github.event.pull_request.number }} --approve --body "<one-sentence reasoning>"
              - When in doubt, request changes. Always end on exactly one of approve/request-changes; never on a plain comment
                alone. A job step after this one asserts a submitted review exists on this head SHA and FAILS the run if not,
                so stopping without submitting turns the check red.

            Be terse. No emoji. No filler.
          # `opus` + high effort + adaptive thinking: code review is a
          # judgment-heavy, low-volume, short-output task — spend on the better
          # reasoner. `high` (not `max`) keeps it from deprioritizing the
          # decision rules above; adaptive gives interleaved thinking between
          # the gh tool calls.
          #
          # `opus` is the CLI alias for the LATEST Opus, so a new Opus release
          # is picked up with no edit here. Deliberately NOT a pinned snapshot
          # (drifts) and NOT `opusplan` (that alias is Opus only in plan mode,
          # Sonnet otherwise). No `--fallback-model` is set, and there is no
          # implicit default fallback, so this can never silently land on
          # Sonnet or Haiku.
          #
          # Deliberately NO `Task`. The pr-review-toolkit agents declare
          # `Tools: All tools` but a subagent INHERITS this session-wide
          # allow-list, so every `Bash(git ...)`, Write, TodoWrite and WebFetch
          # call they make is denied. Widening the list does not rescue them
          # either: this checkout is clean and shallow, so the `git diff` they
          # default to returns nothing. Three of them retrying burned 25 denied
          # calls across 36 turns on dosar-rapid.ro#113 and the run ended with
          # no review posted at all. The standard track now reviews inline.
          #
          # Deliberately NO `mcp__github*` entry. The action installs its
          # bundled `github_inline_comment` MCP server only when the caller's
          # allow-list mentions `mcp__github` or `mcp__github_inline_comment*`
          # (install-mcp-server.ts), so naming that tool in the prompt while
          # leaving it out here does not merely deny it — the server never
          # starts and the tool does not exist. That cost one review its whole
          # budget on denied calls. Inline comments now go through the batched
          # `gh api .../pulls/N/reviews` POST in the prompt instead: one call,
          # already covered by `Bash(gh api:*)`, no registration coupling to
          # keep in sync, and the verdict cannot land without its comments.
          #
          # Whenever the prompt names a tool, it is a contract with this list —
          # change one, grep the other.
          #
          # Cost note: one opus pass, not four. The old three-subagent fan-out
          # inherited opus + effort high per agent.
          claude_args: >-
            --model opus
            --effort high
            --thinking adaptive
            --mcp-config '{"mcpServers":{"code-review-graph":{"command":"code-review-graph","args":["serve"]}}}'
            --allowed-tools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh api:*),mcp__code-review-graph__detect_changes_tool,mcp__code-review-graph__get_impact_radius_tool,mcp__code-review-graph__get_review_context_tool,mcp__code-review-graph__get_affected_flows_tool,mcp__code-review-graph__query_graph_tool,mcp__code-review-graph__semantic_search_nodes_tool,mcp__code-review-graph__get_architecture_overview_tool"

      - name: Verify a review was actually submitted
        # claude-code-action does NOT fail when its GitHub-App OIDC exchange is
        # refused. Anthropic's backend rejects that exchange whenever the
        # caller's triggering workflow file (e.g. pr-checks.yml) differs from
        # the default branch — an anti-privilege-escalation guard that fires on
        # ANY byte change to that file, even in an unrelated job. The action
        # logs `Workflow validation failed. The workflow file must exist and
        # have identical content to the version on the repository's default
        # branch`, then exits 0 having posted nothing
        # (anthropics/claude-code-action#443, #722). With every other step
        # succeeding the run goes green and the review is silently absent, so
        # assert the review landed rather than trusting the action's exit code.
        #
        # Scoped to the current head SHA: a review left on an earlier push
        # would otherwise mask a no-op on the push being checked.
        #
        # Scoped to the REVIEWER too, and that is not decoration. Replying to a
        # review thread (`addPullRequestReviewThreadReply`, or the REST replies
        # endpoint) makes GitHub manufacture a single-comment review authored by
        # the replier, state COMMENTED, attached to the head SHA. So working the
        # review loop creates exactly the objects a bare
        # `commit_id + submitted_at` count accepts, and the guard's protection
        # decayed as the loop progressed: round 1 guarded, every round after a
        # reply not. Measured 2026-09-14 on ITGuys-RO/fleet-manager#164 run
        # 34880008061 -- the action was skipped by the OIDC refusal above, the
        # guard printed `Review confirmed (2 submitted)`, and both were reply
        # wrappers under a human account. The step reported green on precisely
        # the failure it exists to catch.
        #
        # Three predicates, because each covers a shape the others cannot:
        #
        #   .user.login == "claude[bot]"  -- MEASURED, not assumed. 40 reviewer
        #     rows across dustfeather/shared-workflows#42 and
        #     ITGuys-RO/fleet-manager#164, all `claude[bot]`; the bare login
        #     `claude` appears nowhere. #46 proposed accepting both -- do not,
        #     since `claude` is a registrable username and accepting it lets any
        #     human holding it satisfy this check.
        #   .user.type == "Bot"           -- defence in depth for the same reason.
        #   a real verdict, or a COMMENTED review with a NON-EMPTY body
        #     -- the reviewer's own `--allowed-tools` grants `gh api:*`, so the
        #     agent can create reply wrappers itself, and an author filter alone
        #     would then accept them. Every wrapper observed (71 of them across
        #     those two PRs) has a zero-length body; every genuine review has
        #     246-2595 characters. COMMENTED stays allowed because a real review
        #     can be COMMENTED -- the body length, not the state, is what
        #     separates the two.
        #
        # Widening any of the three re-opens a silent pass. Verify against real
        # review JSON rather than reasoning about it.
        if: steps.codeql_gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq \
            "[.[] | select(.commit_id == \"$SHA\"
                and .submitted_at != null
                and .user.type == \"Bot\"
                and .user.login == \"claude[bot]\"
                and (.state == \"APPROVED\"
                     or .state == \"CHANGES_REQUESTED\"
                     or (.state == \"COMMENTED\" and ((.body // \"\") | length) > 0)))] | length")
          if [ "${reviews:-0}" -eq 0 ]; then
            echo "::error::Claude Code Review submitted no review on $SHA. Known causes: (1) this PR modifies the .github/workflows file which triggers the review job, so the action's OIDC token exchange is refused and it no-ops -- land the workflow change in its own PR first, then push this branch again; (2) the agent ran but never reached the closing \`gh pr review\` call, usually because a tool the prompt mandates is missing from --allowed-tools -- check the step log for permission_denials_count. The transcript is hidden unless the caller passes show-full-output: true, so re-run with that set to see which call was denied. Note this counts reviews by claude[bot] only, and ignores the empty-bodied COMMENTED reviews GitHub creates as a side effect of replying to a review thread -- your own replies on this SHA will never satisfy it."
            exit 1
          fi
          echo "Review confirmed on $SHA ($reviews submitted)."
