# Reusable release pipeline for browser extensions.
#
# Caller (per-repo .github/workflows/release.yml):
#
#   name: Release
#   on: { push: { branches: [main] } }
#   permissions: { contents: write }
#   concurrency: { group: release, cancel-in-progress: true }
#   jobs:
#     release:
#       uses: dustfeather/shared-workflows/.github/workflows/release-extension.yml@v7
#       with:
#         runner: arc-df-<repo>
#         targets: '["chrome","firefox"]'   # discord-purge adds "userscript"
#         addon-id: <repo>@dustfeather        # firefox AMO; omit if no firefox
#       secrets: inherit
#
# Repo contract (uniform across all extension repos):
#   - pnpm, with pnpm-lock.yaml committed. Do NOT pin "packageManager" in
#     package.json: this workflow passes a version to pnpm/action-setup, and
#     the action hard-errors when both sources are present.
#   - a `build:<target>` script per declared target that:
#       * reads the version from $EXT_VERSION and stamps its own manifest(s)
#       * writes the FINISHED artifact to dist-artifacts/<base>-<target>-<tag>.<ext>
#         chrome -> .zip, firefox -> .xpi, userscript -> .user.js
name: Release extension (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: ARC scale-set label for this repo's runner pool.
        required: true
        type: string
      targets:
        description: JSON array of build targets. chrome/firefox publish to stores; anything else is release-only.
        type: string
        default: '["chrome","firefox"]'
      base-name:
        description: Artifact filename base. Defaults to the repo name.
        type: string
        default: ""
      addon-id:
        description: Firefox AMO addon id. Required only if "firefox" is in targets.
        type: string
        default: ""
      node-version:
        type: string
        default: "26"
      pnpm-version:
        description: |
          Exact pnpm version. Forwarded to the nested node-test.yml call as
          well, so `tests` and `build` always agree.
        type: string
        # Must equal pnpm/action-setup's bootstrap version at the SHA pinned on the
        # `uses:` line below (11.19.0), NOT the runner image's pnpm. Any other value
        # runs pnpm's self-installer through the shared store and breaks every job
        # after the first. Full rationale in node-test.yml; keep the three in sync.
        default: "11.19.0"

# Default for the whole file. `prepare` and `release` raise themselves to
# `contents: write` for the version commit and the GitHub release; `build`,
# `publish-chrome` and `publish-firefox` declare nothing and so inherit this,
# which is what they should have: they move artifacts and talk to the store
# APIs with their own tokens, and none of them writes to the repo.
#
# Without this block those three inherited the repository's default token
# scope, which can be read/write on everything.
permissions:
  contents: read

jobs:
  tests:
    permissions:
      contents: read
    # Still `@v5`, deliberately, and this lags the `@v6` in the caller example
    # at the top of this file. That example is what an EXTERNAL repo writes and
    # resolves against the tag this PR ships; these three are INTRA-repo
    # `uses:`, and they resolve when this file is fetched at whatever tag the
    # caller asked for -- including `v5`.
    #
    # v6 does not exist until this PR's own merge cuts it, so rolling them here
    # is a bet on the `#major` surviving into the squash subject. This repo
    # merges through frozen `@v5` merge-on-approval, which passes no
    # `--subject` and carries no bump guard, so nothing checks that bet. Lose
    # it and tag-release cuts a PATCH, which re-points floating `v5` onto this
    # tree -- and then every caller on `release-extension.yml@v5` resolves
    # `node-test.yml@v6`, which does not exist: `startup_failure`, zero jobs,
    # empty logs, every caller at once.
    #
    # The cost of waiting was one follow-up commit; the cost of being wrong
    # was every caller. So these three only ever point at a major that is
    # ALREADY cut: v6.0.0 when that was current (#43), v7.0.0 now -- which also
    # stops them sitting on a frozen major.
    #
    # Moving them matters for this `tests` job specifically. `pnpm-version` is
    # forwarded below, but the pnpm/action-setup SHA pin is NOT an input -- it
    # lives inside node-test.yml. On frozen `@v6` that call resolved
    # v6.2.4's node-test.yml, whose `uses: pnpm/action-setup@v6` is a floating
    # tag: the forwarded 11.19.0 matched its bootstrap only by luck, and a
    # bootstrap bump upstream would have broken `tests` while `build` in this
    # same file stayed pinned and green.
    uses: dustfeather/shared-workflows/.github/workflows/node-test.yml@v7
    with:
      runner: ${{ inputs.runner }}
      # Forwarded so both jobs install the SAME pnpm. node-test.yml carries its
      # own default, so leaving this out would let `tests` and `build` resolve
      # different majors and run --frozen-lockfile against one lockfile from two
      # pnpm versions -- the exact split this input exists to close.
      pnpm-version: ${{ inputs.pnpm-version }}

  prepare:
    needs: tests
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      base: ${{ steps.ver.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version + push tag
        id: ver
        run: |
          git fetch --tags --force --quiet
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS='.' read -r ma mi pa <<< "$latest"
            next="$ma.$mi.$((pa + 1))"
          fi
          base="${{ inputs.base-name }}"
          [ -z "$base" ] && base="${GITHUB_REPOSITORY##*/}"
          {
            echo "version=$next"
            echo "tag=v$next"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$next"
          git push origin "v$next"
          echo "Releasing $base v$next (previous: ${latest:-none})"

  build:
    needs: prepare
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      EXT_VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BASE: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Authenticate to npm registry
        run: |
          set -u
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN unset — registry calls stay anonymous."
            exit 0
          fi
          # The ${NPM_TOKEN} below is written LITERALLY: npm, pnpm and yarn all
          # expand env references when they READ .npmrc, so the token value
          # never lands on disk, in a cache layer or in an artifact.
          # shellcheck disable=SC2016  # ${NPM_TOKEN} is written literally on purpose — see above.
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' >> "$HOME/.npmrc"
          echo "Wrote registry auth to ~/.npmrc (token read from env at use time)."

      # A caller can pass any string, and the static check in
      # scripts/check-workflows.py cannot see it -- it only compares the defaults
      # declared in this repo. "12" was the shipped default in v7.0.0, so a repo
      # that pinned it explicitly while debugging those failures would keep the
      # exact break the pin fixes, and the floating @v7 tag would look inert.
      #
      # Fail here, before the action runs, rather than at the ERR_PNPM_BROKEN_
      # PNPM_INSTALL that lands on the SECOND job with nothing naming the cause.
      # PNPM_BOOTSTRAP_VERSION must equal the pnpm-version default above;
      # scripts/check-workflows.py asserts that it does.
      - name: Reject a pnpm-version the pinned action does not bootstrap
        env:
          PNPM_BOOTSTRAP_VERSION: "11.19.0"
          REQUESTED: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "$PNPM_BOOTSTRAP_VERSION" ]; then
            exit 0
          fi
          echo "::error::pnpm-version is '$REQUESTED', but pnpm/action-setup at the SHA pinned in this workflow bootstraps $PNPM_BOOTSTRAP_VERSION. Any other value makes the action run 'pnpm self-update', which installs pnpm THROUGH pnpm into the shared pnpm_config_store_dir. The first job succeeds and every later one dies with ERR_PNPM_BROKEN_PNPM_INSTALL. Remove the pnpm-version input to take the default."
          exit 1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          # The action's self-installer shells out to `npm install` against
          # registry.npmjs.org, so npm_config_* applies. `audit` is the
          # important one: npm audits by default after install, which POSTs to
          # /-/npm/v1/security/audits — the endpoint that accepts a request and
          # never answers during npm advisory-API incidents, turning a ~5s step
          # into a multi-minute hang (see issue #24). The retry budget covers
          # the package fetch itself.
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_fetch_retries: "5"
          npm_config_fetch_timeout: "120000"
          npm_config_fetch_retry_maxtimeout: "120000"
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm install --frozen-lockfile

      # Repo's build:<target> stamps $EXT_VERSION into its manifest(s) and writes
      # the finished artifact to dist-artifacts/<base>-<target>-<tag>.<ext>.
      - name: Build & package ${{ matrix.target }}
        run: pnpm run "build:${{ matrix.target }}"

      # Firefox source package (AMO review) + release notes — only the firefox
      # leg needs them, so produce them here.
      - name: Package source + release notes (firefox only)
        if: matrix.target == 'firefox'
        run: |
          mkdir -p dist-artifacts
          git archive --format=zip --prefix=source/ \
            -o "dist-artifacts/${BASE}-source-${TAG}.zip" HEAD
          prev=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -2 | head -1)
          if [ -n "$prev" ] && [ "v$prev" != "$TAG" ]; then
            git log "v${prev}..${TAG}" --pretty=format:"- %s" > dist-artifacts/release-notes.txt || true
          fi
          [ -s dist-artifacts/release-notes.txt ] || echo "- Release ${TAG}" > dist-artifacts/release-notes.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extensions-${{ matrix.target }}
          path: dist-artifacts/
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: extensions-*
          path: dl
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dl/*.zip
            dl/*.xpi
            dl/*.user.js

  publish-chrome:
    needs: [prepare, build]
    if: contains(fromJSON(inputs.targets), 'chrome')
    uses: dustfeather/shared-workflows/.github/workflows/publish-chrome.yml@v7
    with:
      runner: ${{ inputs.runner }}
      artifact-name: extensions-chrome
      zip-name: ${{ needs.prepare.outputs.base }}-chrome-${{ needs.prepare.outputs.tag }}.zip
    secrets: inherit

  publish-firefox:
    needs: [prepare, build]
    if: contains(fromJSON(inputs.targets), 'firefox')
    uses: dustfeather/shared-workflows/.github/workflows/publish-firefox.yml@v7
    with:
      runner: ${{ inputs.runner }}
      artifact-name: extensions-firefox
      xpi-name: ${{ needs.prepare.outputs.base }}-firefox-${{ needs.prepare.outputs.tag }}.xpi
      source-name: ${{ needs.prepare.outputs.base }}-source-${{ needs.prepare.outputs.tag }}.zip
      addon-id: ${{ inputs.addon-id }}
    secrets: inherit
