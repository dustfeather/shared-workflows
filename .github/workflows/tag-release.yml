name: Tag release

# Every push to main bumps the version and re-points the floating major tag
# (v1, v2, ...) at the new commit so `@v1` callers track main.
#
# Versioning scheme (mechanical, NOT semver — but you can override per commit):
#
#   Default (no token in the commit subject):
#     patch += 1; when patch would hit 100 it wraps to 0 and minor += 1.
#     minor grows without bound — major is NEVER bumped automatically,
#     because a major bump can break `@vN` callers.
#
#   Manual override — put one of these tokens in a commit message when you
#   want a bigger bump for the use case at hand:
#     #major  -> major += 1, minor = 0, patch = 0   (deliberate only)
#     #minor  -> minor += 1, patch = 0
#     #patch  -> patch += 1                          (identical to default)
#   If several appear, the largest wins. The match is a fixed-string search of
#   the SUBJECT line of every commit in the push being tagged. Both halves of
#   that are deliberate, and each was learned the hard way:
#
#     every commit, not just HEAD — GitHub fires exactly one run per push, at
#     the head SHA, so reading only HEAD silently discards a token carried by
#     an earlier commit in a batch. That is how deploy-k8s.yml, a whole new
#     reusable workflow, shipped under a patch tag.
#
#     subjects, not bodies — a commit body that *discusses* a bump matches
#     itself. A commit whose only change was fixing this script, whose body
#     explained that a token "was dropped and released as a patch", cut a
#     spurious minor. Prose about versioning is normal in a body; a token in a
#     subject is a decision.
#
#   So: don't write these tokens verbatim in a SUBJECT unless you mean them.
#   Bodies are safe.
#
# Why there are two triggers. `push` is the real one. But a PR merged by
# pr-merge.yml is merged with the default GITHUB_TOKEN, and GitHub does not
# create workflow runs from events raised by that token — so a bot merge lands
# on main and fires NO push event, cutting no tag and leaving `v4` behind,
# silently. That suppression is a property of the token, not of the trigger:
# `pull_request: [closed]` is silenced in exactly the same way, so there is no
# "any merge into main" event to listen for instead. `workflow_run` is the one
# thing that still fires, because it is raised by the triggering run's own
# lifecycle rather than by the token's action.
#
# It therefore fires on completions that merged nothing — a skipped
# trusted-trigger gate, a non-approving review. The head-already-tagged guard
# below makes those a clean no-op rather than a spurious release.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["PR merge on approval"]
    types: [completed]

permissions:
  contents: write

# Serialize: two quick merges must not both read the same "latest" tag and
# race to create the same next one.
concurrency: tag-release

jobs:
  tag:
    # A failed or cancelled merge run left main untouched; only a successful
    # one can have added the commits this would tag. `push` carries no
    # workflow_run object, so the first clause is what lets it through.
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # Highest existing vX.Y.Z tag (the bare floating "v1" has no dots so
          # the glob skips it; "^{}" derefs never appear in `git tag -l`).
          # Scoped to tags REACHABLE from the pushed ref, not the global highest.
          # Globally-highest means that once any vN+1 tag exists anywhere, no
          # push can ever cut vN.x again — so an accidental major permanently
          # strands every caller pinned @vN with no way back. `--merged` also
          # lets a release/vN branch keep cutting patches after main moves on.
          # `fetch-depth: 0` above is what makes this work.
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --merged "$GITHUB_SHA" \
                   | sed 's/^v//' | sort -V | tail -1)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<<"$latest"

          # Commit the last release points at. Empty on a repo with no tags yet.
          released=$(git rev-list -n1 "v${latest}" 2>/dev/null || true)

          # The workflow_run trigger fires on every completion of the merge
          # workflow, including ones that merged nothing — a skipped
          # trusted-trigger gate, a review that was not an approval. If the
          # head is already what the last release tagged, there is nothing new
          # on main, so skip instead of cutting a version for no change.
          if [ -n "$released" ] && [ "$released" = "$GITHUB_SHA" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
              # Say it loudly on this path. The benign reading is a merge run
              # that merged nothing. The other reading is that a merge did
              # happen but main had not moved yet when this run was handed its
              # SHA — and then the commit is stranded, because a bot merge
              # raises no push event and there is no second workflow_run
              # coming. `mode: direct` in pr-merge.yml is what rules that out;
              # this warning is here so that if it ever regresses, the miss is
              # visible instead of reading as a clean no-op.
              echo "::warning::v${latest} already points at ${GITHUB_SHA}, so this merge-run completion had nothing to release. Expected when the trusted-trigger gate skipped or the review was not an approval. If a merge DID land around now, it is untagged and needs one by hand — check that pr-merge.yml still passes mode: direct."
            fi
            echo "v${latest} already points at ${GITHUB_SHA} — nothing new on main to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual override token in ANY commit of THIS push (fixed-string match).
          # One push of N commits fires one run, at the head SHA — so reading
          # only HEAD drops a token carried by an earlier commit in the batch.
          # `before` is unusable on a workflow_run (the event carries no push
          # range at all), a first push to a new branch (all-zeros), a
          # force-push that orphaned the old commit, or a re-run after history
          # was rewritten. Fall back to everything since the last RELEASE
          # rather than to HEAD alone: HEAD-only silently drops a token carried
          # by an earlier commit, which is the exact bug the paragraph above
          # says was already fixed once. Tag-to-head is if anything a wider net
          # than the push range, and nothing between them has been released.
          # SUBJECTS ONLY (%s, not %s%n%b). Scanning bodies too looks harmless
          # and is not: a commit whose body *explains* a version bump — "this
          # dropped the #minor and released it as a patch" — matches itself and
          # bumps the minor. That is not hypothetical; it is how v4.4.0 got
          # created by a commit that only fixed this script.
          if [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range_src=push
            msg=$(git log --format='%s' "${BEFORE}..${GITHUB_SHA}")
            echo "Scanning $(git rev-list --count "${BEFORE}..${GITHUB_SHA}") commit subject(s) in this push for a bump token."
          elif [ -n "$released" ]; then
            range_src=tag
            msg=$(git log --format='%s' "${released}..${GITHUB_SHA}")
            echo "No usable push range; scanning $(git rev-list --count "${released}..${GITHUB_SHA}") commit subject(s) since v${latest}."
          else
            range_src=head-only
            msg=$(git log -1 --format='%s' HEAD)
            echo "No usable push range and no prior release tag; scanning HEAD's subject only."
          fi
          if   printf '%s' "$msg" | grep -Fq '#major'; then bump=major
          elif printf '%s' "$msg" | grep -Fq '#minor'; then bump=minor
          else bump=patch
          fi
          echo "Bump: $bump (from v${major}.${minor}.${patch})"

          # A major bump strands every caller pinned to the outgoing floating
          # tag, so it must be a decision taken on the release-defining commit —
          # not something inherited from anywhere in a push range. This fires
          # closed: it refuses rather than quietly downgrading to minor, because
          # a token that was meant seriously deserves an explicit re-push.
          if [ "$bump" = major ] \
             && ! git log -1 --format='%s' "$GITHUB_SHA" | grep -Fq '#major'; then
            if [ "$range_src" = push ]; then
              echo "::error::A major token was found in this push, but not in the head commit's subject. Refusing to cut v$((major + 1)).0.0 — it would strand every caller pinned to v${major}. Re-push with the token on the head commit subject if it is intended."
              exit 1
            fi
            # Refusing here instead would WEDGE the workflow. A tag-scoped
            # range is not one push's worth of commits: it re-reads every
            # unreleased commit on main, every run. So one `#major` subject
            # that landed without being on a head would make this refusal fire
            # forever — every later merge rescans it and dies — with no push
            # range to narrow it and no self-healing. The push path above self
            # heals precisely because its next range excludes the commit.
            echo "::warning::A #major token appears on an unreleased commit that is not the head, and this run has no push range to narrow the scan to. Ignoring it rather than failing every future run — re-push with the token on the head subject to cut a major deliberately."
            if printf '%s' "$msg" | grep -Fq '#minor'; then bump=minor; else bump=patch; fi
            echo "Bump downgraded to: $bump"
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          # Patch wraps at 100 into minor. Minor is NOT capped — never auto-bump major.
          if [ "$patch" -ge 100 ]; then patch=0; minor=$((minor + 1)); fi

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "major=v${major}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${major}.${minor}.${patch} (floating tag v${major})"

      - name: Create and push tags
        # Empty when the step above found main already released — a
        # workflow_run completion that merged nothing.
        if: steps.ver.outputs.tag != ''
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          MAJOR: ${{ steps.ver.outputs.major }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists. Another run computed the same version — refusing to move it."
            exit 1
          fi
          case "$TAG" in
            *.0.0)
              echo "::warning::Cutting a new major line ${MAJOR}. Callers pinned to the previous major stop receiving updates until their shims are repointed."
              ;;
          esac
          git tag "$TAG"
          git tag -f "$MAJOR"
          git push origin "$TAG"
          git push -f origin "$MAJOR"
