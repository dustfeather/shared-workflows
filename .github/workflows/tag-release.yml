name: Tag release

# Every push to main bumps the version and re-points the floating major tag
# (v1, v2, ...) at the new commit so `@v1` callers track main.
#
# Versioning scheme (mechanical, NOT semver — but you can override per commit):
#
#   Default (no token in the commit subject):
#     patch += 1; when patch would hit 100 it wraps to 0 and minor += 1.
#     minor grows without bound — major is NEVER bumped automatically,
#     because a major bump can break `@vN` callers.
#
#   Manual override — put one of these tokens in a commit message when you
#   want a bigger bump for the use case at hand:
#     #major  -> major += 1, minor = 0, patch = 0   (deliberate only)
#     #minor  -> minor += 1, patch = 0
#     #patch  -> patch += 1                          (identical to default)
#   If several appear, the largest wins. The match is a fixed-string search of
#   the SUBJECT line of every commit in the push being tagged. Both halves of
#   that are deliberate, and each was learned the hard way:
#
#     every commit, not just HEAD — GitHub fires exactly one run per push, at
#     the head SHA, so reading only HEAD silently discards a token carried by
#     an earlier commit in a batch. That is how deploy-k8s.yml, a whole new
#     reusable workflow, shipped under a patch tag.
#
#     subjects, not bodies — a commit body that *discusses* a bump matches
#     itself. A commit whose only change was fixing this script, whose body
#     explained that a token "was dropped and released as a patch", cut a
#     spurious minor. Prose about versioning is normal in a body; a token in a
#     subject is a decision.
#
#   So: don't write these tokens verbatim in a SUBJECT unless you mean them.
#   Bodies are safe.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize: two quick merges must not both read the same "latest" tag and
# race to create the same next one.
concurrency: tag-release

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # Highest existing vX.Y.Z tag (the bare floating "v1" has no dots so
          # the glob skips it; "^{}" derefs never appear in `git tag -l`).
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<<"$latest"

          # Manual override token in ANY commit of THIS push (fixed-string match).
          # One push of N commits fires one run, at the head SHA — so reading
          # only HEAD drops a token carried by an earlier commit in the batch.
          # Falls back to HEAD when the range is unusable: a first push to a new
          # branch (`before` is all-zeros), a force-push that orphaned the old
          # commit, or a re-run after history was rewritten.
          # SUBJECTS ONLY (%s, not %s%n%b). Scanning bodies too looks harmless
          # and is not: a commit whose body *explains* a version bump — "this
          # dropped the #minor and released it as a patch" — matches itself and
          # bumps the minor. That is not hypothetical; it is how v4.4.0 got
          # created by a commit that only fixed this script.
          if [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            msg=$(git log --format='%s' "${BEFORE}..${GITHUB_SHA}")
            echo "Scanning $(git rev-list --count "${BEFORE}..${GITHUB_SHA}") commit subject(s) in this push for a bump token."
          else
            msg=$(git log -1 --format='%s' HEAD)
            echo "No usable push range; scanning HEAD's subject only."
          fi
          if   printf '%s' "$msg" | grep -Fq '#major'; then bump=major
          elif printf '%s' "$msg" | grep -Fq '#minor'; then bump=minor
          else bump=patch
          fi
          echo "Bump: $bump (from v${major}.${minor}.${patch})"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          # Patch wraps at 100 into minor. Minor is NOT capped — never auto-bump major.
          if [ "$patch" -ge 100 ]; then patch=0; minor=$((minor + 1)); fi

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "major=v${major}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${major}.${minor}.${patch} (floating tag v${major})"

      - name: Create and push tags
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          MAJOR: ${{ steps.ver.outputs.major }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git tag -f "$MAJOR"
          git push origin "$TAG"
          git push -f origin "$MAJOR"
