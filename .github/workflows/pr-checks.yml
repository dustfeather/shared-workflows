name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Human PRs are reviewed locally with the /code-review plugin, not in CI.
    # What stays here is the Dependabot track, which ends on an approve/request-
    # changes and so feeds dependabot-auto-merge.yml / merge-on-approval.yml.
    if: github.event.action != 'closed' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    # `@v9`, floating, matching pr-merge.yml. Each major cut freezes the one
    # before it (tag-release.yml re-points only the CURRENT major), so a pin
    # left on `@v8` would never receive another change to
    # claude-code-review.yml, and the staleness stays invisible for as long as
    # the file happens to match main.
    #
    # `paths-ignore` above excludes this very file, so a PR touching ONLY it
    # starts no "PR checks" run at all. Moving the pin alone therefore lands
    # directly on main; the v9 bump rode in the same PR as the v9 changes,
    # which is fine because a human PR gets no review run either way.
    uses: dustfeather/shared-workflows/.github/workflows/claude-code-review.yml@v9
    with:
      runner: arc-df-shared-workflows
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
