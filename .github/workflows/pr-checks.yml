name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Human PRs are reviewed locally with the /code-review plugin, not in CI.
    # What stays here is the Dependabot track, which ends on an approve/request-
    # changes and so feeds dependabot-auto-merge.yml / merge-on-approval.yml.
    if: github.event.action != 'closed' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    # `@v9`, floating, matching pr-merge.yml. `@v8` is now FROZEN at v8.2.0
    # (926c64f): tag-release.yml re-points only the CURRENT major, so each cut
    # strands the one before it. A pin left on a frozen major can never
    # receive another change to claude-code-review.yml, and the staleness is
    # invisible for as long as the file happens to match main.
    #
    # This bump cannot be shipped as a PR. `paths-ignore` above excludes this
    # very file, so a PR touching ONLY it starts no "PR checks" run at all, and
    # a ref that does not exist yet cannot be pinned before its tag is cut.
    # Landed directly on main instead, as the `@v6` to `@v8` bumps before it.
    uses: dustfeather/shared-workflows/.github/workflows/claude-code-review.yml@v9
    with:
      runner: arc-df-shared-workflows
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
