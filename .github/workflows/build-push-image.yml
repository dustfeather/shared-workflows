name: Build and push image (reusable)

# Builds one container image and pushes it to GHCR, then reports the full
# reference it pushed so a following job can deploy it.
#
# This is split out of deploy-k8s.yml rather than living inside it, and the
# reason is a hard constraint rather than taste: a called workflow may not
# request more GITHUB_TOKEN permission than the calling job grants, and
# `permissions:` accepts no expressions — so a single workflow cannot ask for
# `packages: write` only when it is actually building. Requesting it
# unconditionally makes every non-building caller fail at validation with
# `startup_failure` and zero jobs, which is a genuinely awful thing to debug:
# the explanatory message is UI-only and does not appear in the API, so
# `gh run view --log-failed` returns nothing at all.
#
# So: callers that build run this first and grant it `packages: write`;
# callers that deploy a stock upstream image never see the permission.
#
#   build:
#     permissions: { contents: read, packages: write }
#     uses: dustfeather/shared-workflows/.github/workflows/build-push-image.yml@v6
#   deploy:
#     needs: build
#     permissions: { contents: read }
#     uses: dustfeather/shared-workflows/.github/workflows/deploy-k8s.yml@v6
#     with:
#       image: ${{ needs.build.outputs.image }}
#
# `push: false` builds the image and throws it away, which is what a PR check
# wants: it proves the Dockerfile and its base image still build, on the commit
# under review, without publishing an image for work that may never land.
#
#   image:
#     permissions: { contents: read, packages: write }
#     uses: dustfeather/shared-workflows/.github/workflows/build-push-image.yml@v6
#     with:
#       push: false
#
# `packages: write` is still required there, and the reason is the permission
# constraint above rather than an oversight: `permissions:` accepts no
# expressions, so the build job below requests it unconditionally and a caller
# granting less fails at validation with `startup_failure`.

on:
  workflow_call:
    inputs:
      working-dir:
        description: Directory the build context and Dockerfile resolve against.
        type: string
        default: "."
      docker-context:
        description: Build context, relative to `working-dir`.
        type: string
        default: "."
      dockerfile:
        description: |
          Dockerfile path relative to `working-dir`. Empty uses
          `<docker-context>/Dockerfile`.
        type: string
        default: ""
      image-repo:
        description: |
          Image repo without a tag. Empty derives `ghcr.io/<owner>/<repo>`
          lowercased. Set it when the image name differs from the repo name —
          a monorepo shipping more than one image.
        type: string
        default: ""
      image-tag:
        description: Tag to push. Empty uses the commit SHA.
        type: string
        default: ""
      push:
        description: |
          Push the built image to GHCR. False builds it and discards it — for a
          PR check that wants the Dockerfile exercised but nothing published.
          The registry build cache is not written either; see `build-cache`.
        type: boolean
        default: true
      build-cache:
        description: |
          Push and reuse a registry build cache at `<image-repo>:buildcache`.
          Reading it is independent of `push`, but WRITING it is not: a build
          with `push: false` only reads. `cache-to` is a registry write like any
          other, so leaving it on would let a PR check mutate the cache tag every
          caller of this image pulls from — a published artifact from an
          unreviewed commit, which is the one thing `push: false` is there to
          avoid.
        type: boolean
        default: true
      platforms:
        description: Target platforms for the build.
        type: string
        default: "linux/amd64"
      runner:
        description: |
          Runner label. Must be a scale set with a working docker daemon —
          on the dind sets the daemon is now gated by a startupProbe, so the
          old race against dockerd binding its socket no longer applies.
        type: string
        default: "arc-df-shared-workflows"
    outputs:
      image:
        description: |
          Full reference of the built image, `<repo>:<tag>`. With `push: false`
          nothing was uploaded under that reference, so a deploy job must not
          consume this output from a build-only run.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image reference
        id: img
        env:
          IMAGE_REPO: ${{ inputs.image-repo }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKING_DIR: ${{ inputs.working-dir }}
          DOCKER_CONTEXT: ${{ inputs.docker-context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -eu
          repo="$IMAGE_REPO"
          if [ -z "$repo" ]; then
            # ghcr rejects an uppercase path segment, and GitHub repo names are
            # not case-normalised.
            repo="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          fi
          tag="${IMAGE_TAG:-$SHA}"

          context="$WORKING_DIR/$DOCKER_CONTEXT"
          if [ -n "$DOCKERFILE" ]; then
            file="$WORKING_DIR/$DOCKERFILE"
          else
            file="$context/Dockerfile"
          fi

          if [ ! -f "$file" ]; then
            echo "::error::Dockerfile not found: ${file}"
            exit 1
          fi

          {
            echo "repo=${repo}"
            echo "ref=${repo}:${tag}"
            echo "context=${context}"
            echo "file=${file}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${repo}:${tag} from ${file}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.file }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.img.outputs.ref }}
          cache-from: ${{ inputs.build-cache && format('type=registry,ref={0}:buildcache', steps.img.outputs.repo) || '' }}
          cache-to: ${{ inputs.push && inputs.build-cache && format('type=registry,ref={0}:buildcache,mode=max', steps.img.outputs.repo) || '' }}

      - name: Summary
        if: always()
        env:
          IMAGE_REF: ${{ steps.img.outputs.ref }}
          PUSHED: ${{ inputs.push }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -eu
          # Say which of the three it was. A summary naming a reference nobody
          # can pull reads exactly like a successful push, and this line is the
          # only thing most readers of a run will look at.
          #
          # IMAGE_REF is resolved from the job's inputs, not from anything the
          # build produced, so it is non-empty whether or not an image exists —
          # and `always()` means this step still runs when `Build and push`
          # failed, or never ran at all because an earlier step did (reference
          # resolution, GHCR login), which leaves BUILD_OUTCOME as `skipped`
          # rather than `failure`. Hence the test is against `success` and not
          # against `failure`. In that branch the reference is deliberately
          # omitted: printing one nobody can pull is the whole bug.
          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "### Image — not built (build outcome: \`${BUILD_OUTCOME}\`)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUSHED" = "true" ]; then
            echo "### Image — \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Image — \`${IMAGE_REF}\` (built only, not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi
