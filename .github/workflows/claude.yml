name: Claude Code (interactive, reusable)

on:
  workflow_call:
    inputs:
      trusted-actors:
        description: |
          Comma-separated list of GitHub actors allowed to invoke @claude.
        type: string
        default: dustfeather
      runner:
        description: |
          Runner label for this job. Defaults to `arc-df-shared-workflows`;
          a caller pinning a self-hosted pool normally names its own scale-set
          (e.g. `arc-df-uninsta`, `arc-itguys-ro-invest`).

          A GitHub-hosted label (`ubuntu-latest`) is equally valid and is what
          the interactive callers use: every ARC pool lands on the same
          single 4-core node, where a runner pod reserves 1000m as IO
          admission control, so the whole cluster admits two runner pods at a
          time. An interactive Claude session is minutes of API wait, not of
          local CPU or disk, so holding one of those two slots for it starves
          real CI for no gain. See ITGuys-RO/k3s-cluster#16.
        type: string
        default: "arc-df-shared-workflows"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# Top-level default: minimum read. The job widens what it needs.
permissions:
  contents: read

jobs:
  claude:
    if: |
      contains(format(',{0},', inputs.trusted-actors), format(',{0},', github.actor)) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # `rtk` is baked into the self-hosted runner image
      # (runner-image/Dockerfile), so on an ARC pool this step is a version
      # print and nothing else. On a GitHub-hosted runner it is load-bearing:
      # the `settings:` input below wires `rtk hook claude` as a PreToolUse
      # Bash hook, and a hook whose command does not exist fails on EVERY Bash
      # call the agent makes — noisily, and after the job has already started,
      # so it reads as an agent problem rather than a missing binary.
      #
      # Pinned to the same release and checksum as the image; bump both
      # together or the hosted runner silently rewrites commands with a
      # different rtk than the self-hosted one. The tarball is verified before
      # install because this binary rewrites every command the agent runs.
      - name: Ensure rtk is installed
        env:
          RTK_VERSION: "0.42.0"
          RTK_SHA256: cdd4f87ac97ce958f71b53a991880d6adcc41cc5bca1044175a64630980152be
        run: |
          set -euo pipefail
          if command -v rtk >/dev/null 2>&1; then
            echo "rtk already present: $(rtk --version)"
            exit 0
          fi
          curl -fsSL \
            "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/rtk.tar.gz
          echo "${RTK_SHA256}  /tmp/rtk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rtk.tar.gz -C /tmp
          sudo install -m 0755 "$(find /tmp -maxdepth 2 -type f -name rtk | head -1)" /usr/local/bin/rtk
          rm -f /tmp/rtk.tar.gz
          rtk --version

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # Disable rtk's once-a-day telemetry so its hook never makes network
          # calls in CI.
          RTK_TELEMETRY_DISABLED: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Wire rtk as a PreToolUse hook so this interactive responder's Bash
          # calls (git, gh, tests, builds, kubectl, …) are rewritten to their
          # token-compressed `rtk ...` form. No --allowed-tools restriction here,
          # so the rewritten commands need no extra allow-listing. The action
          # seeds ~/.claude/settings.json from this input.
          settings: |
            {"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"rtk hook claude"}]}]}}
          # Match the reusable review job: latest Opus, high effort, adaptive
          # thinking. A comment like "@claude review" lands here (interactive
          # mode), not in the auto-review workflow, so it gets the same depth.
          # `opus` is the alias for the latest Opus — not a pinned snapshot,
          # and not `opusplan` (which falls back to Sonnet outside plan mode).
          claude_args: >-
            --model opus
            --effort high
            --thinking adaptive
