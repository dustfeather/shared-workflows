name: Claude Code (interactive, reusable)

on:
  workflow_call:
    inputs:
      trusted-actors:
        description: |
          Comma-separated list of GitHub actors allowed to invoke @claude.
        type: string
        default: dustfeather
      runner:
        description: |
          Runner label for this job. Defaults to `ubuntu-latest`, which is what
          the interactive callers already passed explicitly before v8 made it
          the default: every ARC pool lands on the same single 4-core node,
          where a runner pod reserves 1000m as IO admission control, so the
          whole cluster admits two runner pods at a time. An interactive Claude
          session is minutes of API wait, not of local CPU or disk, so holding
          one of those two slots for it starves real CI for no gain. See
          ITGuys-RO/k3s-cluster#16.
        type: string
        default: "ubuntu-latest"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# Top-level default: minimum read. The job widens what it needs.
permissions:
  contents: read

jobs:
  claude:
    if: |
      contains(format(',{0},', inputs.trusted-actors), format(',{0},', github.actor)) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `settings:` input, and therefore no PreToolUse hook. In this
          # tag-triggered mode the action supplies its own default
          # `allowedTools` — read-only tools plus `git add`/`commit`/`rm` and
          # the bundled push script — regardless of what `claude_args` says, so
          # a command-rewriting hook could only ever have reached those few git
          # calls. Anything broader was denied above the hook layer and the job
          # still reported success.
          # Match the reusable review job: latest Opus, high effort, adaptive
          # thinking. A comment like "@claude review" lands here (interactive
          # mode), not in the auto-review workflow, so it gets the same depth.
          # `opus` is the alias for the latest Opus — not a pinned snapshot,
          # and not `opusplan` (which falls back to Sonnet outside plan mode).
          claude_args: >-
            --model opus
            --effort high
            --thinking adaptive
