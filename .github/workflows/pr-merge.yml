name: PR merge on approval
# DO NOT RENAME without changing tag-release.yml. Its `workflow_run` trigger
# matches this workflow by NAME — `workflows: ["PR merge on approval"]` — not
# by path, and a name that matches nothing is not an error. Rename one and
# every bot merge stops being tagged, with nothing in any log saying why:
# precisely the silent class the rest of this file exists to close.

# This repo's own shim for merge-on-approval.yml — the piece it never had.
# `pr-checks.yml` gets the review agent to approve; nothing then landed the PR,
# so every green review still needed a human to press Merge.
#
# The approval cascades because claude-code-review.yml approves as the Claude
# GitHub App (`claude[bot]`, type Bot), not with the default GITHUB_TOKEN.
# GitHub's recursion guard suppresses events authored by `github-actions[bot]`
# only, so an App-authored review DOES raise `pull_request_review` and this
# workflow runs. Swap that job to the default token and this silently stops
# firing, with no error anywhere to say why.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# One merge attempt per PR at a time. Two approvals landing close together —
# the agent's and the owner's — would otherwise start two runs, and the loser
# fails against an already-merged PR. That failure is indistinguishable from
# the one case a human should act on (a merge that genuinely could not land),
# so it has to not happen rather than be explained away. Not
# `cancel-in-progress`: a merge already in flight must finish.
concurrency:
  group: pr-merge-${{ github.event.pull_request.number }}

jobs:
  merge:
    # Trusted-trigger gate. merge-on-approval.yml decides what an APPROVAL is
    # (state, draft) but deliberately does not decide WHO may approve — its
    # header defers that to the caller's branch protection. This repo is
    # public and `main` is unprotected, so without a gate here any account
    # could submit an approving review on any open PR and land it on main.
    # tag-release.yml would then re-point `v5`, which every caller resolves at
    # runtime, cross-owner `ITGuys-RO/*` repos included. Self-approval is
    # blocked by GitHub; a second throwaway account is not a barrier.
    # dependabot-auto-merge.yml calls its equivalent check a trusted-trigger
    # gate for the same reason.
    #
    # `claude[bot]` is named explicitly because the review agent's
    # `author_association` is NONE, not OWNER/MEMBER/COLLABORATOR — the
    # association test alone would reject the very approval this exists for.
    #
    # The state test is NOT redundant with merge-on-approval.yml's own. That
    # one decides whether to MERGE; this one decides whether this workflow
    # RUNS at all. Without it, every review the agent posts (four
    # `changes_requested` on this PR alone) starts a run named "PR merge on
    # approval" whose inner job skips.
    #
    # Such a run concludes `skipped`, not `success` — measured on runs
    # 34702777640 and 34702294904 — and tag-release.yml's
    # `conclusion == 'success'` guard is what drops it. So this gate is NOT
    # the barrier between a `changes_requested` review and a release; that
    # guard is. What this buys is the pointless runs never existing, and the
    # trigger's intent staying readable next to the trigger.
    #
    # `draft` is tested here for the same reason: the DRAFT filter lives in
    # merge-on-approval.yml's inner job, so an approving review on a draft
    # would pass this gate and skip the inner job — a `skipped` run that
    # tag-release drops. Testing it here keeps both conditions in one place
    # rather than split across two files.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      (github.event.review.user.login == 'claude[bot]' ||
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
    permissions:
      contents: write
      pull-requests: write
      # Live as of the `@v5` pin below: merge-on-approval closes the PR's
      # linked issues itself, and that write needs this scope. Without it a
      # merged `Closes #N` stores the link and silently never closes — the
      # merge still succeeds, the link is still computed, and nothing goes red.
      #
      # It was granted one release EARLY, while the pin was still `@v4` and
      # nothing here requested it, because the ordering is asymmetric: a caller
      # may always grant MORE than the callee asks, but a callee asking for
      # more than the caller grants is a `startup_failure` with zero jobs and
      # an empty `--log-failed`. Granting it in the same change as the bump is
      # the ordering that breaks. Keep that shape for any future scope.
      issues: write
    # `@v5`, floating, not a pinned `@v5.1.0`. Every other caller of this repo
    # tracks the floating major, and this shim is the one that merges the
    # commits those releases are cut from — pinning it exactly would make this
    # repo's own automation the only thing not exercising what it ships.
    #
    # `@v4` is FROZEN at v4.14.2 and predates the close block entirely:
    # tag-release.yml re-points only the CURRENT major, so the v5 cut stranded
    # v4 where it stood. A pin left on `@v4` does not silently inherit
    # anything; it keeps pre-v5 behaviour for good.
    uses: dustfeather/shared-workflows/.github/workflows/merge-on-approval.yml@v5
    with:
      runner: arc-df-shared-workflows
      # `direct`, not the reusable workflow's `auto` default, because
      # tag-release.yml keys off THIS run finishing. `--auto` hands the merge
      # to GitHub and returns straight away, so the job can complete — firing
      # `workflow_run` — while main is still the pre-merge commit. tag-release
      # would then find the head already tagged, log "nothing new on main to
      # release", exit clean, and the merge would land moments later with no
      # push event and no workflow_run left: the commit sits on main untagged
      # for good, and the log line reads like correct behaviour.
      #
      # `direct` merges inside the step, so the run only completes once main
      # has actually moved. It is also what merge-on-approval.yml documents
      # `direct` for — no branch protection here means no required check for
      # `--auto` to wait on anyway, so `auto` buys nothing and costs the race.
      #
      # `direct` does not retry, and that is the intended failure mode. If the
      # merge cannot land — mergeability not computed yet, a conflict, main
      # moved between the approval and the merge — the run goes RED and the PR
      # stays open. Nothing re-triggers it: another approving review does, but
      # the agent will not post one unprompted. Push to the branch (which
      # re-runs the review) or merge by hand. A red run left visible is the
      # right outcome; the alternative is a retry loop racing whatever moved.
      mode: direct
      # Rebase, not the reusable workflow's `squash` default. tag-release.yml
      # picks the version bump by scanning `#minor`/`#major` across the SUBJECT
      # of every commit in the push — subjects only, deliberately, so that
      # prose about versioning in a body cannot cut a release. A squash
      # collapses N subjects into one, so a token carried by an earlier commit
      # is lost and a minor bump silently lands as a patch. Rebase replays each
      # commit onto main with its subject intact.
      merge-method: rebase
      # Merge the commit that was actually reviewed. An approval names a SHA;
      # a merge does not. With no branch protection there is no stale-review
      # dismissal, so a commit pushed between the approval and this job would
      # otherwise land unreviewed — and tag-release then re-points `v5`, which
      # every caller resolves at runtime — 103 `uses:` references across 5
      # owners as of 2026-09-13, cross-owner `ITGuys-RO/*` repos included.
      # A moved head fails the job and leaves the PR open, which is right.
      match-head-commit: ${{ github.event.review.commit_id }}
      # `delete-branch` is deliberately NOT set. The repo carries
      # `delete_branch_on_merge: true`, which deletes the head branch on every
      # merge whatever this input says — passing `false` would only stop `gh`
      # deleting it a second time, while documenting a guarantee the file
      # cannot deliver. Nothing is lost either way: the `@feature/<name>` ref a
      # caller pins to e2e-test an unreleased change is needed BEFORE the
      # merge, and the tag supersedes it after.
